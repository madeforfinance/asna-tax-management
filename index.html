<style>
/* ASNA Tax Client Manager — premium corporate theme */
:root{
  --navy:#0B1F3A; --navy2:#123B68; --gold:#D4AF37; --gold-dark:#b8942a;
  --white:#FFFFFF; --bg:#F5F7FA; --ink:#1c2733; --muted:#64748b;
  --line:#e2e8f0; --card:#ffffff; --danger:#c0392b; --warn:#b7791f;
  --ok:#1e7e46; --info:#1d5fa8;
  --radius:10px; --shadow:0 1px 3px rgba(11,31,58,.08),0 4px 14px rgba(11,31,58,.06);
  --sidebar-w:236px; --sidebar-wc:64px; --topbar-h:56px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

/* ---------- svg icons ---------- */
.ico{flex:0 0 auto;vertical-align:-3px}
.nav-ico{display:inline-flex;align-items:center;justify-content:center;width:22px;flex:0 0 auto}
.nav-ico .ico{width:20px;height:20px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center}
.opt-ico{display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--navy)}
.opt-ico .ico{width:30px;height:30px}
.badge .ico,.btn .ico{margin-right:6px}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
h1,h2,h3,h4{margin:0 0 .5rem;color:var(--navy);font-weight:650}
h1{font-size:22px}h2{font-size:18px}h3{font-size:15px}h4{font-size:13.5px}
p{margin:0 0 .6rem}
.muted{color:var(--muted)} .small{font-size:12px}
a{color:var(--navy2)}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--navy);color:#dbe4f0;flex:0 0 auto;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .18s ease;z-index:40}
.sidebar.collapsed{width:var(--sidebar-wc)}
.sidebar.collapsed .brand-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .privacy-chip .chip-label{display:none}
.sidebar.collapsed .sidebar-brand{flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 6px;gap:10px}
.sidebar.collapsed .brand-mark{margin:0}
.sidebar.collapsed .privacy-chip{display:flex;justify-content:center;padding:8px 4px}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px 4px}
.sidebar.collapsed #sidebar-collapse .ico-collapse{display:none}
.sidebar:not(.collapsed) #sidebar-collapse .ico-expand{display:none}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{width:34px;height:34px;border-radius:8px;flex:0 0 auto;display:block;object-fit:cover}
.brand-text{display:flex;flex-direction:column;line-height:1.15;color:#fff;flex:1;min-width:0}
.brand-text strong{letter-spacing:1px}.brand-text small{color:var(--gold);font-size:10.5px;letter-spacing:.4px}
.icon-btn{background:none;border:none;color:inherit;font-size:18px;cursor:pointer;padding:6px 8px;border-radius:6px}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.nav{flex:1;overflow-y:auto;padding:10px 8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;margin:1px 0;border:none;background:none;
  color:#c9d6e8;border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--gold);color:var(--navy);font-weight:650}
.nav-ico{width:22px;text-align:center;flex:0 0 auto;font-size:15px}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.12)}
.privacy-chip{background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.5);color:var(--gold);
  border-radius:8px;padding:7px 9px;font-size:11.5px;cursor:pointer;text-align:center}
.privacy-chip:hover{background:rgba(212,175,55,.25)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--white);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 18px;position:sticky;top:0;z-index:30}
.topbar-title{font-size:16px;font-weight:650;color:var(--navy)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.client-picker-label{font-size:12px;color:var(--muted)}
.view{padding:20px 22px 60px;max-width:1240px;width:100%;margin:0 auto;min-height:calc(100vh - var(--topbar-h))}
.only-mobile{display:none}

/* ---------- cards / grids ---------- */
.grid{display:grid;gap:14px}
.grid.kpi{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin-bottom:10px}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;border-top:3px solid var(--navy2);cursor:default}
.kpi-card.gold{border-top-color:var(--gold)}
.kpi-card .kpi-num{font-size:26px;font-weight:700;color:var(--navy)}
.kpi-card .kpi-label{font-size:12px;color:var(--muted);margin-top:2px}
.kpi-card.clickable{cursor:pointer}.kpi-card.clickable:hover{border-color:var(--gold)}
.section-head{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
.section-head h2{margin:0;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-head h3{margin:0;flex:1}
.panel-body{padding:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.data{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.data th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-weight:600;white-space:nowrap;font-size:12px;letter-spacing:.2px}
table.data td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
table.data tr:hover td{background:#f8fafc}
table.data tfoot td{background:#f1f5f9;font-weight:700;border-top:2px solid var(--line)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-actions{white-space:nowrap;text-align:right}

/* ---------- forms ---------- */
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>label{font-size:12.5px;font-weight:600;color:var(--navy)}
.field .req{color:var(--danger)}
.field .hint{font-size:11.5px;color:var(--muted)}
.input,select.input,textarea.input{border:1px solid #cbd5e1;border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;width:100%;background:#fff;color:var(--ink)}
.input:focus{outline:2px solid rgba(212,175,55,.55);border-color:var(--gold)}
textarea.input{min-height:74px;resize:vertical}
.input-sm{width:auto;min-width:180px;padding:6px 8px;font-size:12.5px}
select.input-sm{min-width:200px}
.check-row{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.check-row input{margin-top:3px}
.radio-row{display:flex;gap:14px;flex-wrap:wrap}
.form-error{color:var(--danger);font-size:12.5px;margin-top:4px}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:7px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:inherit;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--gold-dark)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
.btn-outline{background:#fff;border:1px solid #b9c4d4;color:var(--navy)}.btn-outline:hover{border-color:var(--navy)}
.btn-danger{background:#fff;border:1px solid var(--danger);color:var(--danger)}.btn-danger:hover{background:#fdeeee}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- badges / status ---------- */
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;white-space:nowrap}
.b-new{background:#e8eef5;color:var(--navy2)}
.b-progress{background:#fff4d6;color:#8a6d1a;border:1px solid #ecd27a}
.b-await{background:#ffe9d6;color:#9a4a12}
.b-complete{background:#e3f4e8;color:var(--ok)}
.b-review{background:#e7edfb;color:#2b4a9e}
.b-ready{background:var(--navy);color:var(--gold)}
.b-archived{background:#eef1f5;color:var(--muted)}
.b-critical{background:#fbdcdc;color:#8f1d12}
.b-high{background:#ffe9d6;color:#9a4a12}
.b-medium{background:#fff4d6;color:#8a6d1a}
.b-low{background:#e7edfb;color:#2b4a9e}
.b-info{background:#eef1f5;color:var(--muted)}
.b-open{background:#fbdcdc;color:#8f1d12}
.b-resolved{background:#e3f4e8;color:var(--ok)}
.b-accepted{background:#e7edfb;color:#2b4a9e}
.cat-chip{display:inline-block;background:#eef2f7;border:1px solid var(--line);border-radius:6px;
  padding:2px 8px;font-size:11.5px;margin:1px 3px 1px 0;color:var(--navy2)}

/* ---------- interview ---------- */
.interview-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.stepper{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;position:sticky;top:calc(var(--topbar-h) + 16px)}
.step{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;
  padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--ink)}
.step:hover{background:#f1f5f9}
.step.active{background:var(--navy);color:#fff}
.step.active .step-sub{color:#c9d6e8}
.step-num{width:24px;height:24px;border-radius:50%;background:#e2e8f0;color:var(--navy);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.step.active .step-num{background:var(--gold);color:var(--navy)}
.step.done .step-num{background:var(--ok);color:#fff}
.step-sub{font-size:11px;color:var(--muted);display:block}
.q-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.q-card.na{opacity:.55;background:#f8fafc}
.q-head{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.q-text{flex:1;font-weight:600;color:var(--navy);font-size:13.5px}
.q-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.q-tag{font-size:10.5px;padding:1px 7px;border-radius:12px;background:#eef2f7;color:var(--muted);border:1px solid var(--line)}
.q-tag.req{background:#fbdcdc;color:#8f1d12;border-color:#f3b8b8}
.q-tag.doc{background:#e7edfb;color:#2b4a9e;border-color:#b9cdf3}
.progress{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold));transition:width .3s}
.repeat-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.repeat-row .input{flex:1}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;background:rgba(11,31,58,.55);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.modal{background:#fff;border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-head h3{margin:0;flex:1}
.modal-body{padding:18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.modal-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted)}
.toast-root{position:fixed;bottom:18px;right:18px;z-index:500;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:13.5px;max-width:340px}
.toast.ok{border-left:4px solid #2ecc71}.toast.err{border-left:4px solid #e74c3c}

/* ---------- welcome / profile screens ---------- */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt-card{background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;padding:18px 12px;cursor:pointer;font-family:inherit}
.opt-card:hover{border-color:var(--gold);background:#fffdf4}
.opt-card .opt-ico{font-size:26px}
.opt-card strong{display:block;color:var(--navy);margin:6px 0 2px;font-size:14px}
.opt-card small{color:var(--muted)}
.profile-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px;font-family:inherit;font-size:13.5px}
.profile-row:hover{border-color:var(--gold);background:#fffdf4}
.profile-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:0 0 auto}
.back-link{background:none;border:none;color:var(--navy2);cursor:pointer;font-size:13px;margin-top:10px;text-decoration:underline;font-family:inherit}

/* ---------- lock screen ---------- */
.lock-screen{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:300}
.lock-card{background:#fff;border-radius:14px;padding:34px;width:360px;text-align:center}
.lock-card .brand-mark{margin:0 auto 12px;width:52px;height:52px;border-radius:10px}
.lock-card .input{margin:12px 0}
.lock-hint{font-size:11.5px;margin-top:12px}

/* ---------- misc ---------- */
.empty{padding:26px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:8px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{border:none;background:none;padding:9px 14px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--navy);border-bottom-color:var(--gold)}
.kv{display:grid;grid-template-columns:190px 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0}
.alert{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px;border:1px solid}
.alert.warn{background:#fff8e6;border-color:#ecd27a;color:#7a5c12}
.alert.info{background:#eaf1fb;border-color:#b9cdf3;color:#24447e}
.alert.danger{background:#fdeeee;border-color:#f3b8b8;color:#8f1d12}
.alert.ok{background:#eaf7ee;border-color:#a9dcc0;color:#14532d}
.diff-positive{color:var(--danger);font-weight:700}.diff-zero{color:var(--ok);font-weight:700}
#print-area{display:none}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.list-plain li:last-child{border-bottom:none}
.search-row{display:grid;grid-template-columns:1fr 160px 190px 190px auto;gap:8px;margin-bottom:12px}
.stat-link{cursor:pointer;color:var(--navy2);text-decoration:underline}

/* ---------- print ---------- */
@media print{
  .sidebar,.topbar,.toolbar,.btn-row,.toast-root,#modal-root,.no-print{display:none!important}
  #print-area{display:block!important}
  .app,#app{display:none!important}
  body{background:#fff}
  .print-doc{font-size:12px;color:#000}
  .print-doc h1{font-size:20px;border-bottom:3px solid #0B1F3A;padding-bottom:6px}
  .print-doc h2{font-size:15px;margin-top:18px;border-bottom:1px solid #999;padding-bottom:4px}
  .print-doc table{width:100%;border-collapse:collapse;margin:8px 0}
  .print-doc th,.print-doc td{border:1px solid #666;padding:5px 7px;font-size:11.5px;text-align:left}
  .print-doc th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .print-brand{font-weight:800;font-size:16px;color:#0B1F3A}
  .print-brand span{color:#8a6d1a}
  .print-meta{font-size:11px;color:#444;text-align:right}
  .print-foot{margin-top:16px;font-size:10.5px;color:#555;border-top:1px solid #999;padding-top:6px;display:flex;justify-content:space-between}
  .page-break{page-break-before:always}
}
@page{size:A4;margin:14mm}

@media (max-width:1100px){.interview-layout{grid-template-columns:1fr}.stepper{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none}.sidebar.collapsed{width:var(--sidebar-w)}
  .only-mobile{display:inline-block}
  .search-row{grid-template-columns:1fr 1fr}
  .view{padding:14px 12px 60px}

<script>
/* ASNA Tax Client Manager — IndexedDB persistence layer (offline-first, local only) */
const DB = (() => {
  const NAME = 'asna-tax-client-manager';
  const VERSION = 1;
  let db = null;

  const STORES = {
    clients:      { keyPath: 'id', indexes: [] },
    answers:      { keyPath: 'id', indexes: [['clientId', 'clientId', { unique: false }]] },
    documents:    { keyPath: 'id', indexes: [['clientId', 'clientId', { unique: false }]] },
    incomes:      { keyPath: 'id', indexes: [['clientId', 'clientId', { unique: false }]] },
    assets:       { keyPath: 'id', indexes: [['clientId', 'clientId', { unique: false }]] },
    wealth:       { keyPath: 'clientId', indexes: [] },
    issues:       { keyPath: 'id', indexes: [['clientId', 'clientId', { unique: false }]] },
    taxyears:     { keyPath: 'year', indexes: [] },
    customqs:     { keyPath: 'id', indexes: [['stage', 'stage', { unique: false }]] },
    activity:     { keyPath: 'id', indexes: [] }
  };

  function open() {
    return new Promise((resolve, reject) => {
      if (db) return resolve(db);
      const req = indexedDB.open(NAME, VERSION);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        for (const [store, def] of Object.entries(STORES)) {
          if (d.objectStoreNames.contains(store)) continue;
          const os = d.createObjectStore(store, { keyPath: def.keyPath });
          for (const [iname, ikey, iopt] of def.indexes) os.createIndex(iname, ikey, iopt);
        }
      };
      req.onsuccess = (e) => { db = e.target.result; resolve(db); };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function tx(store, mode, fn) {
    return open().then((d) => new Promise((resolve, reject) => {
      const t = d.transaction(store, mode);
      const os = t.objectStore(store);
      let out;
      try { out = fn(os); } catch (err) { reject(err); return; }
      t.oncomplete = () => resolve(out && out.__result !== undefined ? out.__result : out);
      t.onerror = (e) => reject(e.target.error);
      t.onabort = (e) => reject(e.target.error || new Error('Transaction aborted'));
    }));
  }

  function reqToPromise(r) {
    return new Promise((resolve, reject) => {
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  return {
    open,
    storeNames: Object.keys(STORES),

    all(store) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readonly');
        const r = t.objectStore(store).getAll();
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => reject(r.error);
      }));
    },

    get(store, key) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readonly');
        const r = t.objectStore(store).get(key);
        r.onsuccess = () => resolve(r.result || null);
        r.onerror = () => reject(r.error);
      }));
    },

    put(store, value) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readwrite');
        const r = t.objectStore(store).put(value);
        r.onsuccess = () => resolve(value);
        r.onerror = () => reject(r.error);
      }));
    },

    add(store, value) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readwrite');
        const r = t.objectStore(store).add(value);
        r.onsuccess = () => resolve(value);
        r.onerror = () => reject(r.error);
      }));
    },

    del(store, key) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readwrite');
        const r = t.objectStore(store).delete(key);
        r.onsuccess = () => resolve(true);
        r.onerror = () => reject(r.error);
      }));
    },

    byIndex(store, index, value) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readonly');
        const r = t.objectStore(store).index(index).getAll(value);
        r.onsuccess = () => resolve(r.result || []);
        r.onerror = () => reject(r.error);
      }));
    },

    clear(store) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readwrite');
        const r = t.objectStore(store).clear();
        r.onsuccess = () => resolve(true);
        r.onerror = () => reject(r.error);
      }));
    },

    count(store) {
      return open().then(() => new Promise((resolve, reject) => {
        const t = db.transaction(store, 'readonly');
        const r = t.objectStore(store).count();
        r.onsuccess = () => resolve(r.result || 0);
        r.onerror = () => reject(r.error);
      }));
    }
  };
})();

</script>

const U = {
  uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  },
  // Professional SVG icon. size: number (px) or 'sm' (14) / default 18.
  icon(name, size) {
    const paths = ICONS[name] || ICONS.help;
    const px = size === 'sm' ? 14 : (typeof size === 'number' ? size : 18);
    return '<svg class="ico" width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      paths + '</svg>';
  },
  esc(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },
  num(v) {
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  },
  fmt(n) {
    const v = U.num(n);
    return 'PKR ' + v.toLocaleString('en-PK', { maximumFractionDigits: 0 });
  },
  fmtPlain(n) {
    return U.num(n).toLocaleString('en-PK', { maximumFractionDigits: 0 });
  },
  today() {
    return new Date().toISOString().slice(0, 10);
  },
  fmtDate(d) {
    if (!d) return '—';
    return String(d).slice(0, 10);
  },
  now() { return new Date().toISOString(); },
  debounce(fn, ms) {
    let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms || 400); };
  },

  /* ---------- toast ---------- */
  toast(msg, type) {
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 2600);
    setTimeout(() => el.remove(), 3100);
  },

  /* ---------- modal ---------- */
  modal(title, bodyHTML, footHTML) {
    U.closeModal();
    const root = document.getElementById('modal-root');
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'modal-back';
    back.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>' + U.esc(title) + '</h3>' +
        '<button class="modal-x" id="modal-x" title="Close">&times;</button></div>' +
        '<div class="modal-body">' + bodyHTML + '</div>' +
        (footHTML ? '<div class="modal-foot">' + footHTML + '</div>' : '') +
      '</div>';
    root.appendChild(back);
    const close = () => U.closeModal();
    back.addEventListener('mousedown', (e) => { if (e.target === back) close(); });
    back.querySelector('#modal-x').addEventListener('click', close);
    return back;
  },
  closeModal() {
    const b = document.getElementById('modal-back');
    if (b) b.remove();
  },

  confirm(title, message, okLabel) {
    return new Promise((resolve) => {
      const foot =
        '<button class="btn btn-outline" id="cf-no">Cancel</button>' +
        '<button class="btn btn-danger-solid" id="cf-yes">' + U.esc(okLabel || 'Confirm') + '</button>';
      const back = U.modal(title, '<p>' + message + '</p>', foot);
      back.querySelector('#cf-no').addEventListener('click', () => { U.closeModal(); resolve(false); });
      back.querySelector('#cf-yes').addEventListener('click', () => { U.closeModal(); resolve(true); });
    });
  },

  promptChoice(title, message, choices) {
    // choices: [{label, value, cls}]
    return new Promise((resolve) => {
      const body = '<p>' + message + '</p><div class="btn-row">' +
        choices.map((c, i) => '<button class="btn ' + (c.cls || 'btn-outline') + '" data-i="' + i + '">' + U.esc(c.label) + '</button>').join('') +
        '</div>';
      const back = U.modal(title, body, '');
      back.querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => {
        const v = choices[parseInt(b.dataset.i, 10)].value;
        U.closeModal(); resolve(v);
      }));
    });
  },

  /* ---------- file download ---------- */
  download(filename, content, mime) {
    const blob = new Blob([content], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
  },

  toCSV(rows) {
    return rows.map((r) => r.map((c) => {
      const s = c === null || c === undefined ? '' : String(c);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(',')).join('\n');
  },

  /* ---------- print (browser print -> Save as PDF; works offline) ---------- */
  printHTML(docTitle, bodyHTML, metaLine) {
    const area = document.getElementById('print-area');
    const now = new Date().toLocaleString('en-PK');
    area.innerHTML =
      '<div class="print-doc">' +
        '<div class="print-head"><div class="print-brand">ASNA <span>Consultancy</span></div>' +
        '<div class="print-meta">' + U.esc(metaLine || '') + '<br>Generated: ' + U.esc(now) + '</div></div>' +
        '<h1>' + U.esc(docTitle) + '</h1>' + bodyHTML +
        '<div class="print-foot"><span>ASNA Consultancy — Tax Client Manager (internal working paper; not an official FBR/IRIS return)</span><span>Page</span></div>' +
      '</div>';
    document.title = docTitle + ' — ASNA Tax Client Manager';
    setTimeout(() => window.print(), 60);
  },

  /* ---------- field builders ---------- */
  field(label, inner, opts) {
    opts = opts || {};
    return '<div class="field"><label>' + U.esc(label) +
      (opts.req ? ' <span class="req">*</span>' : '') + '</label>' + inner +
      (opts.hint ? '<span class="hint">' + U.esc(opts.hint) + '</span>' : '') + '</div>';
  },
  input(name, value, type, attrs) {
    return '<input class="' + 'input' + '" name="' + U.esc(name) + '" type="' + (type || 'text') +
      '" value="' + U.esc(value === undefined || value === null ? '' : value) + '"' +
      (attrs ? ' ' + attrs : '') + '>';
  },
  select(name, value, options, attrs) {
    // options: [[value,label],...]
    const opts = options.map((o) =>
      '<option value="' + U.esc(o[0]) + '"' + (String(o[0]) === String(value) ? ' selected' : '') + '>' + U.esc(o[1]) + '</option>'
    ).join('');
    return '<select class="input" name="' + U.esc(name) + '"' + (attrs ? ' ' + attrs : '') + '>' + opts + '</select>';
  },
  textarea(name, value, attrs) {
    return '<textarea class="input" name="' + U.esc(name) + '"' + (attrs ? ' ' + attrs : '') + '>' +
      U.esc(value === undefined || value === null ? '' : value) + '</textarea>';
  },
  formValues(form) {
    const data = {};
    new FormData(form).forEach((v, k) => {
      if (data[k] !== undefined) {
        if (!Array.isArray(data[k])) data[k] = [data[k]];
        data[k].push(v);
      } else data[k] = v;
    });
    return data;
  },

  sha256(str) {
    // PIN hashing only — not encryption. Uses SubtleCrypto when available,
    // otherwise a compact pure-JS SHA-256 with identical output (some
    // browser contexts don't expose crypto.subtle; the PIN must still work).
    const buf = new TextEncoder().encode(str);
    if (window.crypto && crypto.subtle && typeof crypto.subtle.digest === 'function') {
      return crypto.subtle.digest('SHA-256', buf).then((h) =>
        Array.from(new Uint8Array(h)).map((b) => b.toString(16).padStart(2, '0')).join(''));
    }
    return Promise.resolve(sha256Fallback(buf));
  }
};

/* Compact pure-JS SHA-256 (fallback when SubtleCrypto is unavailable).
   Standard algorithm; output is byte-identical to crypto.subtle.digest. */
function sha256Fallback(bytes) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a,
      h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const bitLen = bytes.length * 8;
  const blocks = Math.ceil((bytes.length + 9) / 64);
  const msg = new Uint8Array(blocks * 64);
  msg.set(bytes);
  msg[bytes.length] = 0x80;
  const dv = new DataView(msg.buffer);
  dv.setUint32(msg.length - 8, Math.floor(bitLen / 0x100000000));
  dv.setUint32(msg.length - 4, bitLen >>> 0);
  const w = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let b = 0; b < blocks; b++) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(b * 64 + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let a = h0, bb = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const mj = (a & bb) ^ (a & c) ^ (bb & c);
      const t2 = (S0 + mj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + bb) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0;
    h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
}

<script>
/* =====================================================================
   ASNA Tax Client Manager — main application (vanilla JS, IndexedDB)
   Internal professional tool. All data stays in this browser.
   ===================================================================== */
'use strict';

const state = {
  clients: [],
  profile: null,          // signed-in user profile {id, name, ...}
  activeClientId: null,
  route: 'dashboard',
  routeParam: null,
  interviewStage: 1,
  incomeTab: 'salary',
  assetTab: 'assets',
  clientSearch: { q: '', year: '', cat: '', status: '', archived: false }
};

const qs = (s, r) => (r || document).querySelector(s);
const qsa = (s, r) => Array.from((r || document).querySelectorAll(s));

const NAV = [
  ['dashboard', 'Dashboard', 'dashboard'],
  ['clients', 'Clients', 'users'],
  ['new-client', 'New Client', 'user-plus'],
  ['interview', 'Tax Interview', 'help'],
  ['documents', 'Document Checklist', 'file'],
  ['income', 'Income & Tax Info', 'banknote'],
  ['assets', 'Assets & Liabilities', 'landmark'],
  ['wealth', 'Wealth Reconciliation', 'scale'],
  ['review', 'Review & QC', 'clipboard-check'],
  ['papers', 'Working Papers', 'copy'],
  ['reports', 'Reports & Export', 'chart'],
  ['settings', 'Settings', 'settings']
];
const CLIENT_ROUTES = ['interview', 'documents', 'income', 'assets', 'wealth', 'review', 'papers'];

// Single source of truth for the running code version (shown in Diagnostics;
// if this differs from the HTML version tag, the browser mixed cached files).
const APP_VERSION = '1.9.3';
let lastAppError = null;

/* ============================== boot ============================== */
/* ============================== boot ============================== */
async function boot() {
  await DB.open();
  await ensureTaxYears();
  await refreshClients();
  showWelcome();
}

function enterApp() {
  qs('#welcome-screen').hidden = true;
  qs('#app').hidden = false;
  renderShell();
  wireTopbar();
  route('dashboard');
}

/* ============================== client PIN sessions ==============================
   Welcome screen offers 2 options: Existing Client Login or New Client.
   Every tax-client file can carry its own login PIN. Entering the PIN opens
   that client's workspace; without the right PIN the file stays closed.     */
let welcomeView = 'choose';
let welcomeClient = null;

function showWelcome() {
  state.sessionClientId = null;
  state.activeClientId = null;
  qs('#app').hidden = true;
  qs('#welcome-screen').hidden = false;
  welcomeView = 'choose';
  welcomeClient = null;
  wStatus('');
  renderWelcome();
}

function visibleClients() {
  return state.clients.filter((c) => !c.archived);
}

function wStatus(msg) {
  const el = qs('#w-status');
  if (el) el.textContent = msg || '';
}

async function runWelcomeSelfTest() {
  const rows = [];
  const step = (name, ok, detail) => rows.push('<tr><td>' + U.icon(ok ? 'check-circle' : 'x-circle', 'sm') + ' ' + U.esc(name) + '</td><td>' + U.esc(detail || '') + '</td></tr>');
  wStatus('Running self-test…');
  step('App code running', true, 'v' + APP_VERSION);
  step('Secure context', !!window.isSecureContext, String(window.isSecureContext));
  step('crypto.subtle available', !!(window.crypto && window.crypto.subtle), String(!!(window.crypto && window.crypto.subtle)));
  step('IndexedDB available', 'indexedDB' in window, String('indexedDB' in window));
  try { await DB.open(); step('Database opened', true, 'asna-tax-client-manager'); }
  catch (e) { step('Database opened', false, (e && e.message) || String(e)); }
  try { const n = await DB.count('clients'); step('Clients in database', true, n + ' record(s)'); }
  catch (e) { step('Clients in database', false, (e && e.message) || String(e)); }
  step('Clients loaded in memory', true, state.clients.length + ' client(s)');
  const first = state.clients[0];
  step('Clients ready', true, first ? (first.fullName + ' (' + first.id + ')') : 'none yet — create or import one');
  try {
    const h = await U.sha256('test');
    step('PIN hash engine (SHA-256)', h === '9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08', h.slice(0, 12) + '…');
  } catch (e) { step('PIN hash engine (SHA-256)', false, (e && e.message) || String(e)); }
  wStatus('');
  U.modal('Self-Test Results',
    '<p class="small muted">If any row shows a cross mark, tell support exactly which one and its detail.</p>' +
    '<table class="data"><tbody>' + rows.join('') + '</tbody></table>',
    '<button class="btn btn-gold" id="st-ok">Close</button>')
    .querySelector('#st-ok').onclick = () => U.closeModal();
}

function renderWelcome() {
  const main = qs('#welcome-main');
  const sub = qs('#welcome-sub');

  if (welcomeView === 'choose') {
    sub.textContent = 'Log in to a client file with its PIN, or create a new client.';
    main.innerHTML =
      '<div class="opt-grid">' +
      '<button class="opt-card" id="w-login"><div class="opt-ico">' + U.icon('key', 30) + '</div><strong>Existing Client Login</strong><small>Enter client PIN</small></button>' +
      '<button class="opt-card" id="w-create"><div class="opt-ico">' + U.icon('plus', 30) + '</div><strong>New Client</strong><small>Setup details + assign PIN</small></button>' +
      '</div>' +
      '<div style="text-align:center;margin-top:10px"><button class="back-link" id="w-diag" style="margin-top:0">Diagnostics</button> · ' +
      '<button class="back-link" id="w-selftest" style="margin-top:0">Run self-test</button> · ' +
      '<button class="back-link" id="w-import" style="margin-top:0">Import backup (JSON)</button></div>' +
      '<input type="file" id="w-file" accept="application/json,.json" hidden>';
    qs('#w-login').onclick = () => { wStatus('Loading client list…'); welcomeView = 'login'; renderWelcome(); };
    qs('#w-create').onclick = () => { wStatus('Opening new-client form…'); try { openWelcomeNewClient(); } catch (e) { wStatus('Error: ' + (e && e.message ? e.message : e)); } };
    qs('#w-diag').onclick = () => showDiagnostics();
    qs('#w-selftest').onclick = () => runWelcomeSelfTest();
    qs('#w-import').onclick = () => qs('#w-file').click();
    qs('#w-file').addEventListener('change', async (e) => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      try {
        wStatus('Importing backup…');
        const res = await importBackupFile(f);
        wStatus('');
        if (!res) return;
        U.toast(res.type === 'full' ? 'Full backup restored.' : 'Client imported: ' + res.name, 'ok');
        renderWelcome();
      } catch (err) {
        wStatus('Import failed: ' + err.message);
        U.toast('Could not read backup file: ' + err.message, 'err');
      }
    });
  }
  else if (welcomeView === 'login') {
    sub.textContent = 'Select the client file to open.';
    const list = visibleClients();
    main.innerHTML =
      '<input class="input" id="w-search" placeholder="Search client…" style="margin-bottom:10px">' +
      '<div id="w-list" style="max-height:38vh;overflow-y:auto"></div>' +
      '<button class="back-link" id="w-back">← Back</button>';
    const draw = () => {
      const q = qs('#w-search').value.trim().toLowerCase();
      const rows = list.filter((c) =>
        !q || [c.fullName, c.internalId, c.cnic, c.ntn, c.phone].join(' ').toLowerCase().includes(q));
      qs('#w-list').innerHTML = rows.length ? rows.map((c) =>
        '<button class="profile-row" data-cid="' + c.id + '"><span class="profile-avatar">' +
        U.esc((c.fullName || '?').trim().charAt(0).toUpperCase()) + '</span>' +
        '<span style="flex:1"><strong>' + U.esc(c.fullName) + '</strong><br><small class="muted">' +
        U.esc(c.internalId || '') + ' · Tax Year ' + U.esc(c.taxYear) + '</small></span>' +
        '<span title="' + (c.pinHash ? 'PIN protected' : 'No PIN set') + '">' + U.icon(c.pinHash ? 'lock' : 'unlock', 'sm') + '</span></button>'
      ).join('') : '<div class="empty">No client files yet.<br><button class="btn btn-gold btn-sm" id="w-empty-create" style="margin-top:10px">+ Create Your First Client</button></div>';
      qsa('[data-cid]', main).forEach((b) => b.addEventListener('click', () => {
        try {
          const c = state.clients.find((x) => x.id === b.dataset.cid);
          if (!c) { wStatus('Error: client record not found — please reload the page.'); U.toast('Client record not found — please reload the page.', 'err'); return; }
          if (c.pinHash) { wStatus('PIN required for ' + (c.fullName || 'client') + '…'); welcomeClient = c; welcomeView = 'pin'; renderWelcome(); }
          else {
            wStatus('Opening ' + (c.fullName || 'client') + '…');
            startClientSession(c.id).catch((e) => { wStatus('Error: ' + (e && e.message ? e.message : e)); U.toast('Could not open the file: ' + (e && e.message ? e.message : e), 'err'); });
          }
        } catch (e) {
          wStatus('Error: ' + (e && e.message ? e.message : e));
          U.toast('Could not open the file: ' + (e && e.message ? e.message : e), 'err');
        }
      }));
      const ec = qs('#w-empty-create', main);
      if (ec) ec.onclick = () => openWelcomeNewClient();
    };
    qs('#w-search').addEventListener('input', draw);
    qs('#w-back').onclick = () => { wStatus(''); welcomeView = 'choose'; renderWelcome(); };
    draw();
    qs('#w-search').focus();
  }
  else if (welcomeView === 'pin') {
    sub.textContent = 'Enter the PIN for this client file.';
    main.innerHTML =
      '<div style="text-align:left"><div class="profile-row" style="cursor:default"><span class="profile-avatar">' +
      U.esc((welcomeClient.fullName || '?').trim().charAt(0).toUpperCase()) + '</span>' +
      '<span style="flex:1"><strong>' + U.esc(welcomeClient.fullName) + '</strong><br><small class="muted">' +
      U.esc(welcomeClient.internalId || '') + '</small></span></div>' +
      U.field('Client PIN', U.input('w-pin', '', 'password', 'id="w-pin-input" inputmode="numeric" placeholder="Enter PIN" autocomplete="off"'), {}) +
      '<p class="form-error" id="w-pin-err" hidden>Incorrect PIN. Please try again.</p>' +
      '<button class="btn btn-gold" id="w-unlock" style="width:100%">Open Client File</button></div>' +
      '<button class="back-link" id="w-back">← Back</button>';
    const tryUnlock = async () => {
      try {
        wStatus('Checking PIN…');
        const h = await U.sha256('client-pin:' + qs('#w-pin-input').value);
        if (h === welcomeClient.pinHash) {
          wStatus('PIN accepted. Opening file…');
          await startClientSession(welcomeClient.id);
        } else {
          const e = qs('#w-pin-err');
          e.hidden = false; e.textContent = 'Incorrect PIN. Please try again.';
          qs('#w-pin-input').value = '';
          qs('#w-pin-input').focus();
        }
      } catch (err) {
        const e = qs('#w-pin-err');
        e.hidden = false; e.textContent = 'Could not open the file: ' + (err && err.message ? err.message : err);
      }
    };
    qs('#w-unlock').onclick = tryUnlock;
    qs('#w-pin-input').onkeydown = (e) => { if (e.key === 'Enter') tryUnlock(); };
    qs('#w-back').onclick = () => { wStatus(''); welcomeView = 'login'; renderWelcome(); };
    qs('#w-pin-input').focus();
  }
}

function openWelcomeNewClient() {
  const body = '<form id="wcn-form">' + clientFormFields({}, 'required') + '</form>' +
    '<p class="form-error" id="wcn-err" hidden></p>';
  const back = U.modal('New Client', body,
    '<button class="btn btn-outline" id="wcn-no">Cancel</button><button class="btn btn-gold" id="wcn-yes">Create Client File</button>');
  back.querySelector('#wcn-no').onclick = () => U.closeModal();
  back.querySelector('#wcn-yes').onclick = async () => {
    const err = back.querySelector('#wcn-err');
    try {
      const form = back.querySelector('#wcn-form');
      const fd = U.formValues(form);
      const vErr = validateClientForm(fd, null);
      if (vErr) { err.hidden = false; err.textContent = vErr; return; }
      const p1 = form.querySelector('[name=pin1]').value, p2 = form.querySelector('[name=pin2]').value;
      if (!/^\d{4,}$/.test(p1)) { err.hidden = false; err.textContent = 'Client PIN must be at least 4 digits.'; return; }
      if (p1 !== p2) { err.hidden = false; err.textContent = 'PINs do not match.'; return; }
      const rec = buildClientRecord({}, fd);
      rec.pinHash = await U.sha256('client-pin:' + p1);
      await DB.put('clients', rec);
      await logActivity(rec.id, 'Client file created with login PIN.');
      U.closeModal();
      await refreshClients();
      U.toast('Client file created.', 'ok');
      await startClientSession(rec.id);
    } catch (e) {
      err.hidden = false;
      err.textContent = 'Could not create the client file: ' + (e && e.message ? e.message : e);
    }
  };
}

async function startClientSession(clientId) {
  const c = state.clients.find((x) => x.id === clientId);
  if (!c) { showWelcome(); return; }
  state.sessionClientId = clientId;
  state.activeClientId = clientId;
  const firstRun = !localStorage.getItem('asna_seen_privacy');
  enterApp();
  if (firstRun) showPrivacyModal(true);
  await logActivity(clientId, 'Client file opened (PIN session).');
}

function switchClient() {
  state.sessionClientId = null;
  state.activeClientId = null;
  state.clients = [];
  refreshClients().then(() => showWelcome());
}

function validateClientForm(fd, existingId) {
  const g = (n) => (fd[n] || '').trim();
  const cats = fd.categories ? (Array.isArray(fd.categories) ? fd.categories : [fd.categories]) : [];
  if (!g('fullName')) return 'Full Name is required.';
  if (!g('internalId')) return 'Internal Client ID is required.';
  if (!cats.length) return 'Select at least one client category.';
  if (state.clients.some((x) => x.internalId === g('internalId') && x.id !== existingId)) return 'Internal Client ID already exists. Choose a unique one.';
  return null;
}

function buildClientRecord(existing, fd) {
  const g = (n) => (fd[n] || '').trim();
  const cats = fd.categories ? (Array.isArray(fd.categories) ? fd.categories : [fd.categories]) : [];
  const c = existing || {};
  return Object.assign({}, c, {
    id: c.id || U.uid('c'),
    internalId: g('internalId'), fullName: g('fullName'),
    cnic: g('cnic'), ntn: g('ntn'), phone: g('phone'),
    email: g('email'), address: g('address'), occupation: g('occupation'),
    taxYear: g('taxYear'), residency: fd.residency, taxpayerStatus: fd.taxpayerStatus,
    categories: cats, notes: g('notes'), workflow: fd.workflow || c.workflow || 'new',
    archived: !!c.archived, isSample: !!c.isSample,
    pinHash: c.pinHash || null,
    createdAt: c.createdAt || U.now(), updatedAt: U.now()
  });
}

    U.field('New PIN (min. 4 digits)', U.input('pin1', '', 'password', 'inputmode="numeric" autocomplete="new-password"'), { req: true }) +
    U.field('Confirm new PIN', U.input('pin2', '', 'password', 'inputmode="numeric" autocomplete="new-password"'), { req: true });
  const back = U.modal(c.pinHash ? 'Change Client PIN' : 'Set Client PIN', body,
    '<button class="btn btn-outline" id="pn-no">Cancel</button><button class="btn btn-gold" id="pn-yes">Save PIN</button>');
  back.querySelector('#pn-no').onclick = () => U.closeModal();

/* ============================== data helpers ============================== */
async function getAnswersMap(clientId) {
  const rows = await DB.byIndex('answers', 'clientId', clientId);
  const map = {};
  rows.forEach((r) => { map[r.qid] = r; });
  return map;
}

function ansValue(map, qid) {
  const r = map[qid];
  return r ? r.value : undefined;
}

function showIfMet(q, map) {
  if (!q.showIf) return true;
  const v = ansValue(map, q.showIf.q);
  if (q.showIf.eq !== undefined) return v === q.showIf.eq;
  if (q.showIf.in) return q.showIf.in.includes(v);
  return true;
}

function questionApplies(q, client) {
  if (q.cats !== 'all' && !(q.cats || []).some((k) => client.categories.includes(k))) return false;
  return true;
}

async function applicableQuestions(client) {
  const map = await getAnswersMap(client.id);
  const customs = (await DB.all('customqs')).filter((r) => r.clientId === client.id);
  const all = DATA.QB.concat(customs.map((c) => ({
    id: c.id, stage: c.stage, text: c.text, type: c.type, required: c.required,
    cats: c.cats, options: c.options, hint: 'Custom question', custom: true
  })));
  return all.filter((q) => questionApplies(q, client) && showIfMet(q, map)).map((q) => ({ q, ans: map[q.id] || null }));
}

function isAnswered(q, ans) {
  if (!ans) return false;
  if (ans.na) return true;
  const v = ans.value;
  if (v === undefined || v === null || v === '') return false;
  if (Array.isArray(v)) return v.some((x) => x !== '' && x !== null && x !== undefined);
  return true;
}

async function interviewProgress(client) {
  const list = await applicableQuestions(client);
  const req = list.filter((x) => x.q.required);
  const done = req.filter((x) => isAnswered(x.q, x.ans)).length;
  return { total: list.length, reqTotal: req.length, reqDone: done, pct: req.length ? Math.round((done / req.length) * 100) : 100 };
}

async function saveAnswer(clientId, qid, value, na) {
  const rows = await DB.byIndex('answers', 'clientId', clientId);
  const existing = rows.find((r) => r.qid === qid);
  const rec = existing || { id: U.uid('a'), clientId, qid };
  rec.value = value; rec.na = !!na; rec.updatedAt = U.now();
  await DB.put('answers', rec);
  const c = state.clients.find((x) => x.id === clientId);
  if (c) { c.updatedAt = U.now(); await DB.put('clients', c); }
}

function vClients(v) {

    '<div class="section-head"><h2>Clients</h2>' +
    '<button class="btn btn-gold btn-sm" id="cl-new">+ New Client</button></div>' +
    '<div class="search-row">' +

        years.map((y) => '<option' + (s.year === y ? ' selected' : '') + '>' + U.esc(y) + '</option>').join('') + '</select>' +
      '<select class="input" id="f-cat"><option value="">All categories</option>' +
        DATA.CATS.map((c) => '<option value="' + c[0] + '"' + (s.cat === c[0] ? ' selected' : '') + '>' + U.esc(c[1]) + '</option>').join('') + '</select>' +
      '<select class="input" id="f-status"><option value="">All statuses</option>' +
        DATA.STATUSES.map((x) => '<option value="' + x[0] + '"' + (s.status === x[0] ? ' selected' : '') + '>' + U.esc(x[1]) + '</option>').join('') + '</select>' +
      '<label class="check-row" style="white-space:nowrap"><input type="checkbox" id="f-arch"' + (s.archived ? ' checked' : '') + '> <span class="small">Archived</span></label>' +
    '</div>' +
    '<div class="table-wrap"><table class="data"><thead><tr>' +
    '<th>Client ID</th><th>Full Name</th><th>Tax Year</th><th>Categories</th><th>Status</th><th>Updated</th><th></th>' +
    '</tr></thead><tbody id="cl-rows"></tbody></table></div>' +
    '<p class="muted small" id="cl-count" style="margin-top:8px"></p>';

  const draw = () => {
    const q = qs('#f-q').value.trim().toLowerCase();
    const rows = state.clients.filter((c) => {
      if (!s.archived && c.archived) return false;
      if (s.archived && !c.archived) return false;
      if (s.year && c.taxYear !== s.year) return false;
      if (s.cat && !c.categories.includes(s.cat)) return false;
      if (s.status && c.workflow !== s.status) return false;
      if (q && ![c.fullName, c.cnic, c.ntn, c.phone, c.internalId, c.email].join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
    qs('#cl-rows').innerHTML = rows.length ? rows.map((c) =>
      '<tr><td>' + U.esc(c.internalId || '—') + '</td>' +
      '<td><a href="#" class="stat-link" data-open="' + c.id + '">' + U.esc(c.fullName) + '</a>' +
      (c.isSample ? ' <span class="badge b-info">Sample</span>' : '') + '<br><span class="muted small">' + U.esc(c.cnic || '') + '</span></td>' +
      '<td>' + U.esc(c.taxYear) + '</td>' +
      '<td>' + c.categories.map((k) => '<span class="cat-chip">' + U.esc(DATA.catLabel(k)) + '</span>').join('') + '</td>' +
      '<td><span class="badge ' + DATA.statusClass(c.workflow) + '">' + U.esc(DATA.statusLabel(c.workflow)) + '</span></td>' +
      '<td class="small muted">' + U.esc((c.updatedAt || '').slice(0, 10)) + '</td>' +
      '<td class="row-actions"><button class="btn btn-sm btn-outline" data-open="' + c.id + '">Open</button></td></tr>'
    ).join('') : '<tr><td colspan="7"><div class="empty">No clients match the filters.</div></td></tr>';
    qs('#cl-count').textContent = rows.length + ' client(s) shown.';
    qsa('[data-open]', v).forEach((b) => b.addEventListener('click', (e) => {
      e.preventDefault(); startClientSession(b.dataset.open);
    }));
  };
  ['f-q', 'f-year', 'f-cat', 'f-status'].forEach((id) => {
    qs('#' + id).addEventListener('input', () => {
      s.q = qs('#f-q').value; s.year = qs('#f-year').value; s.cat = qs('#f-cat').value; s.status = qs('#f-status').value;
      draw();
    });
  });
  qs('#f-arch').addEventListener('change', (e) => { s.archived = e.target.checked; draw(); });
  qs('#cl-new').onclick = () => route('new-client');
  draw();
}

function nextInternalId(year) {
  const seq = state.clients.filter((c) => (c.internalId || '').startsWith('ATC-' + year)).length + 1;
  return 'ATC-' + year + '-' + String(seq).padStart(3, '0');
}

function vClientNew(v, existing) {
  const c = existing || {};
  const isEdit = !!existing;
  v.innerHTML =
    '<div class="section-head"><h2>' + (isEdit ? 'Edit Client' : 'New Client') + '</h2></div>' +
    '<form id="client-form"><div class="panel"><div class="panel-head"><h3>Client Details</h3></div><div class="panel-body">' +
    clientFormFields(c, isEdit ? 'optional' : 'required') +
    '<div class="form-error" id="cf-err" hidden></div>' +
    '<div class="btn-row"><button type="submit" class="btn btn-gold">' + (isEdit ? 'Save Changes' : 'Create Client File') + '</button>' +
    '<button type="button" class="btn btn-outline" id="cf-cancel">Cancel</button></div>' +
    '</div></div></form>';

  qs('#cf-cancel').onclick = () => route(isEdit ? 'client-profile' : 'dashboard', isEdit ? c.id : null);
  qs('#client-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const fd = U.formValues(form);
    const err = qs('#cf-err');
    const vErr = validateClientForm(fd, c.id || null);
    if (vErr) { err.hidden = false; err.textContent = vErr; return; }
    const p1 = form.querySelector('[name=pin1]').value, p2 = form.querySelector('[name=pin2]').value;
    let pinHash = c.pinHash || null;
    if (p1 || p2) {
      if (!/^\d{4,}$/.test(p1)) { err.hidden = false; err.textContent = 'Client PIN must be at least 4 digits.'; return; }
      if (p1 !== p2) { err.hidden = false; err.textContent = 'PINs do not match.'; return; }
      pinHash = await U.sha256('client-pin:' + p1);
    } else if (!isEdit && !pinHash) {
      err.hidden = false; err.textContent = 'Please assign a client PIN.';
      return;
    }
    err.hidden = true;
    const rec = buildClientRecord(c, fd);
    rec.pinHash = pinHash;
    await DB.put('clients', rec);
    await logActivity(rec.id, isEdit ? 'Client details updated.' : 'Client file created.');
    await refreshClients();
    const ix = state.clients.findIndex((x) => x.id === rec.id);
    if (ix > -1) state.clients[ix] = rec;
    U.toast(isEdit ? 'Client updated.' : 'Client file created.', 'ok');
    if (isEdit) route('client-profile', rec.id);
    else startClientSession(rec.id);
  });
}

async function duplicateClient(c) {
  const body =
    U.field('New Tax Year', U.input('ny', String(parseInt(c.taxYear, 10) + 1 || '2027'), 'text'), { req: true, hint: 'Profile, categories and asset opening balances carry forward. Year-specific answers, documents, income and review issues start fresh.' }) +
    '<p class="muted small">Asset closing balances from Tax Year ' + U.esc(c.taxYear) + ' become opening balances for the new year.</p>';
  const back = U.modal('Duplicate Client for New Tax Year',
    '<p>Copy <strong>' + U.esc(c.fullName) + '</strong> into a new tax-year file?</p>' + body,
    '<button class="btn btn-outline" id="d-no">Cancel</button><button class="btn btn-gold" id="d-yes">Duplicate</button>');
  back.querySelector('#d-no').onclick = () => U.closeModal();
  back.querySelector('#d-yes').onclick = async () => {
    const ny = back.querySelector('[name=ny]').value.trim() || String(parseInt(c.taxYear, 10) + 1);
    const nc = Object.assign({}, c, {
      id: U.uid('c'), internalId: nextInternalId(ny), taxYear: ny,
      workflow: 'new', archived: false, isSample: false,
      createdAt: U.now(), updatedAt: U.now()
    });
    await DB.put('clients', nc);
    const assets = await DB.byIndex('assets', 'clientId', c.id);
    for (const a of assets) {
      await DB.put('assets', Object.assign({}, a, {
        id: U.uid('a'), clientId: nc.id, opening: a.closing, closing: 0, value: 0, updatedAt: U.now()
      }));
    }
    await logActivity(nc.id, 'Client file duplicated from Tax Year ' + c.taxYear + ' (assets carried forward as opening balances).');
    U.closeModal();
    await refreshClients();
    state.sessionClientId = nc.id; state.activeClientId = nc.id;
    U.toast('New tax-year file created: ' + nc.internalId, 'ok');
    route('client-profile', nc.id);
  };
}

async function clientBundle(id) {
  const c = await DB.get('clients', id);
  if (!c) return null;
  const [answers, documents, incomes, assets, wealth, issues] = await Promise.all([
    DB.byIndex('answers', 'clientId', id), DB.byIndex('documents', 'clientId', id),
    DB.byIndex('incomes', 'clientId', id), DB.byIndex('assets', 'clientId', id),
    DB.get('wealth', id), DB.byIndex('issues', 'clientId', id)
  ]);
  const customqs = (await DB.all('customqs')).filter((x) => x.clientId === id);
  return { app: 'ASNA Tax Client Manager', kind: 'client-backup', exportedAt: U.now(), client: c, answers, documents, incomes, assets, wealth, issues, customqs };
}

async function exportClient(id) {

  U.download('asna-client-' + (b.client.internalId || b.client.id) + '.json', JSON.stringify(b, null, 2), 'application/json');
  U.toast('Client JSON exported. Store it securely — it contains unencrypted personal data.', 'ok');

async function backupAll() {

  for (const s of DB.storeNames) dump.stores[s] = await DB.all(s);
  U.download('asna-tax-manager-backup-' + U.today() + '.json', JSON.stringify(dump), 'application/json');
  U.toast('Full backup downloaded. Keep it secure — it is not encrypted.', 'ok');
  await logActivity(null, 'Full JSON backup exported.');
}

// Imports a JSON file produced by "Full JSON Backup" or "Export client".
// Returns { type:'full' } or { type:'client', id, name }, or null if the user
// cancelled. Throws on unreadable/unrecognized files. Works from anywhere
// (welcome screen or inside the app) — the caller decides what to show next.
async function importBackupFile(file) {
  const data = JSON.parse(await file.text());
  if (!data || data.app !== 'ASNA Tax Client Manager') throw new Error('Not an ASNA Tax Client Manager backup file.');
  if (data.kind === 'full-backup' && data.stores) {
    const ok = await U.confirm('Restore full backup?',
      'This will <strong>replace ALL current data</strong> with the backup from ' + U.esc(data.exportedAt || 'unknown date') + '. This cannot be undone.',
      'Restore Backup');
    if (!ok) return null;
    for (const s of DB.storeNames) await DB.clear(s);
    for (const [s, rows] of Object.entries(data.stores)) {
      if (!DB.storeNames.includes(s)) continue;
      for (const r of rows) await DB.put(s, r);
    }
    await refreshClients();
    await logActivity(null, 'Full backup restored from file.');
    return { type: 'full' };
  }
  if (data.kind === 'client-backup' && data.client) {
    const nc = Object.assign({}, data.client, { id: U.uid('c'), updatedAt: U.now() });
    await DB.put('clients', nc);
    const remap = async (rows, store) => {
      for (const r of rows || []) await DB.put(store, Object.assign({}, r, { id: U.uid('x'), clientId: nc.id }));
    };
    await remap(data.answers, 'answers'); await remap(data.documents, 'documents');
    await remap(data.incomes, 'incomes'); await remap(data.assets, 'assets');
    await remap(data.issues, 'issues'); await remap(data.customqs, 'customqs');
    if (data.wealth) await DB.put('wealth', Object.assign({}, data.wealth, { clientId: nc.id }));
    await logActivity(nc.id, 'Client imported from backup file.');
    await refreshClients();
    return { type: 'client', id: nc.id, name: nc.fullName };
  }
  throw new Error('Unrecognized backup file.');
}

/* ============================== TAX INTERVIEW ============================== */
async function vInterview(v) {
  const c = requireClient(v);
  if (!c) return;
  const list = await applicableQuestions(c);
  const byStage = {};
  list.forEach((x) => { (byStage[x.q.stage] = byStage[x.q.stage] || []).push(x); });
  const stage = Math.min(Math.max(state.interviewStage || 1, 1), 12);

  const stepper = DATA.STAGES.map((name, i) => {
    const n = i + 1;
    const qs2 = byStage[n] || [];
    const req = qs2.filter((x) => x.q.required);
    const done = req.filter((x) => isAnswered(x.q, x.ans)).length;
    const cls = n === stage ? 'active' : (req.length && done === req.length ? 'done' : '');
    return '<button class="step ' + cls + '" data-stage="' + n + '"><span class="step-num">' +
      (req.length && done === req.length ? '✓' : n) + '</span><span><span>' + U.esc(name) + '</span>' +
      '<span class="step-sub">' + done + '/' + req.length + ' required</span></span></button>';
  }).join('');

  const p = await interviewProgress(c);
  v.innerHTML = clientHeader(c, 'Structured client interview — answers save automatically') +
    '<div class="toolbar"><div style="flex:1;min-width:200px"><div class="small muted" style="margin-bottom:4px">Overall interview progress: ' +
    p.reqDone + ' of ' + p.reqTotal + ' required questions answered</div>' +
    '<div class="progress"><div style="width:' + p.pct + '%"></div></div></div>' +
    '<button class="btn btn-outline btn-sm" id="iv-custom">+ Add Custom Question</button></div>' +
    '<div class="interview-layout"><div class="stepper">' + stepper + '</div>' +
    '<div><div class="panel"><div class="panel-head"><h3>Stage ' + stage + ': ' + U.esc(DATA.STAGES[stage - 1]) + '</h3></div>' +
    '<div class="panel-body" id="iv-questions"></div>' +
    '<div class="panel-body" style="border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between">' +
      '<button class="btn btn-outline" id="iv-back"' + (stage === 1 ? ' disabled' : '') + '>← Back</button>' +
      '<div style="display:flex;gap:8px"><button class="btn btn-outline" id="iv-save">Save Progress</button>' +
      (stage < 12
        ? '<button class="btn btn-gold" id="iv-next">Next →</button>'
        : '<button class="btn btn-gold" id="iv-finish">Finish Interview</button>') +
      '</div></div></div></div></div>';

  qsa('[data-stage]', v).forEach((b) => b.addEventListener('click', () => { state.interviewStage = +b.dataset.stage; renderView(); }));

  const renderQuestions = async () => {
    const fresh = await applicableQuestions(c);
    const qsList = fresh.filter((x) => x.q.stage === stage);
    const box = qs('#iv-questions');
    if (!qsList.length) {
      box.innerHTML = '<div class="empty">No questions apply at this stage for this client\u2019s categories. You can add a custom question above.</div>';
      return;
    }
    box.innerHTML = qsList.map((x) => qCard(x.q, x.ans)).join('');
    wireQuestionInputs(box, c, renderQuestions);
  };
  await renderQuestions();

  const wireBtn = (id, fn) => { const el = qs(id); if (el) el.onclick = fn; };
  wireBtn('#iv-back', () => { state.interviewStage = stage - 1; renderView(); });
  wireBtn('#iv-next', () => { state.interviewStage = stage + 1; renderView(); });
  wireBtn('#iv-save', async () => {
    await logActivity(c.id, 'Interview progress saved (stage ' + stage + ').');
    U.toast('Progress saved.', 'ok');
  });
  const finBtn = qs('#iv-finish');
  if (finBtn) finBtn.onclick = async () => {
    const pp = await interviewProgress(c);
    if (pp.pct < 100) {
      const go = await U.confirm('Interview incomplete',
        'Only ' + pp.reqDone + ' of ' + pp.reqTotal + ' required questions are answered (' + pp.pct + '%). ' +
        'Finish anyway? Unanswered items will appear in the Missing Information report.',
        'Finish Anyway');
      if (!go) return;
    }
    c.workflow = 'awaiting_documents'; c.updatedAt = U.now();
    await DB.put('clients', c);
    await logActivity(c.id, 'Interview finished; moved to Awaiting Documents.');
    await refreshClients();
    U.toast('Interview finished. Client moved to Awaiting Documents.', 'ok');
    route('documents');
  };
  wireBtn('#iv-custom', () => customQuestionModal(c, stage, () => renderView()));
}

function qCard(q, ans) {
  const na = ans && ans.na;
  const tags =
    (q.required ? '<span class="q-tag req">Required</span>' : '<span class="q-tag">Optional</span>') +
    (q.doc ? '<span class="q-tag doc">' + U.icon('file', 'sm') + ' ' + U.esc(q.doc) + '</span>' : '') +
    (q.custom ? '<span class="q-tag">Custom</span>' : '') +
    (q.cats !== 'all' ? '<span class="q-tag">' + q.cats.map((k) => DATA.catLabel(k)).join(', ') + '</span>' : '');
  return '<div class="q-card' + (na ? ' na' : '') + '" data-qid="' + U.esc(q.id) + '">' +
    '<div class="q-head"><div class="q-text">' + U.esc(q.text) + (q.required ? ' <span class="req">*</span>' : '') + '</div>' +
    '<button class="btn btn-sm ' + (na ? 'btn-navy' : 'btn-outline') + '" data-na>' + (na ? 'N/A ✓ — Clear' : 'Mark N/A') + '</button></div>' +
    (q.hint ? '<div class="hint muted small" style="margin-bottom:8px">' + U.esc(q.hint) + '</div>' : '') +
    '<div data-input>' + qInput(q, ans) + '</div>' +
    '<div class="q-meta">' + tags + '</div>' +
    '<div style="margin-top:8px"><button class="btn btn-sm btn-outline" data-note-toggle>' + U.icon('pencil', 'sm') + ' ' + (ans && ans.note ? 'Edit note' : 'Add internal note') + '</button>' +
    '<div data-notebox hidden style="margin-top:6px"><textarea class="input" data-note rows="2" placeholder="Internal note (not shown to client)">' +
    U.esc((ans && ans.note) || '') + '</textarea></div></div>' +
    '</div>';
}

function qInput(q, ans) {
  const v = ans ? ans.value : undefined;
  const dis = ans && ans.na ? ' disabled' : '';
  const val = (d) => U.esc(v === undefined || v === null ? (d || '') : v);
  switch (q.type) {
    case 'number': return '<input class="input" data-val type="number" step="any" value="' + val('') + '"' + dis + '>';
    case 'currency': return '<div style="display:flex;align-items:center;gap:6px"><span class="muted small">Rs</span><input class="input" data-val type="number" step="any" min="0" value="' + val('') + '"' + dis + '></div>';
    case 'date': return '<input class="input" data-val type="date" value="' + val('') + '"' + dis + '>';
    case 'select': return '<select class="input" data-val' + dis + '><option value="">— Select —</option>' +
      (q.options || []).map((o) => '<option' + (v === o ? ' selected' : '') + '>' + U.esc(o) + '</option>').join('') + '</select>';
    case 'yesno': return '<div class="radio-row"><label><input type="radio" name="r_' + U.esc(q.id) + '" data-val value="yes"' + (v === 'yes' ? ' checked' : '') + dis + '> Yes</label>' +
      '<label><input type="radio" name="r_' + U.esc(q.id) + '" data-val value="no"' + (v === 'no' ? ' checked' : '') + dis + '> No</label></div>';
    case 'checkbox': {
      const arr = Array.isArray(v) ? v : [];
      return '<div>' + (q.options || []).map((o) =>
        '<label class="check-row"><input type="checkbox" data-val value="' + U.esc(o) + '"' + (arr.includes(o) ? ' checked' : '') + dis + '> <span>' + U.esc(o) + '</span></label>').join('') + '</div>';
    }
    case 'textarea': return '<textarea class="input" data-val rows="3"' + dis + '>' + val('') + '</textarea>';
    case 'repeatable-text': case 'repeatable-currency': {
      const arr = Array.isArray(v) ? v : (v ? [v] : ['']);
      const rows = arr.map((x) =>
        '<div class="repeat-row"><input class="input" data-rep type="' + (q.type === 'repeatable-currency' ? 'number' : 'text') + '" value="' + U.esc(x) + '"' + dis + '>' +
        '<button class="btn btn-sm btn-outline" data-rep-del' + dis + '>✕</button></div>').join('');
      return '<div data-rep-list>' + rows + '</div><button class="btn btn-sm btn-outline" data-rep-add' + dis + '>+ Add another</button>';
    }
    default: return '<input class="input" data-val type="text" value="' + val('') + '"' + dis + '>';
  }
}

function readQValue(card, q) {
  if (q.type === 'checkbox') {
    return qsa('[data-val]:checked', card).map((i) => i.value);
  }
  if (q.type === 'yesno') {
    const sel = qs('[data-val]:checked', card);
    return sel ? sel.value : '';
  }
  if (q.type === 'repeatable-text' || q.type === 'repeatable-currency') {
    return qsa('[data-rep]', card).map((i) => i.value).filter((x) => x !== '');
  }
  const el = qs('[data-val]', card);
  return el ? el.value : '';
}

function wireQuestionInputs(box, c, rerender) {
  qsa('.q-card', box).forEach((card) => {
    const qid = card.dataset.qid;
    const q = DATA.QB.find((x) => x.id === qid);
    const save = U.debounce(async () => {
      const val = readQValue(card, q || { type: 'text' });
      const noteEl = qs('[data-note]', card);
      const rows = await DB.byIndex('answers', 'clientId', c.id);
      const existing = rows.find((r) => r.qid === qid);
      const note = noteEl ? noteEl.value : (existing && existing.note) || '';
      await saveAnswer(c.id, qid, val, existing ? existing.na : false);
      if (noteEl) {
        const rows2 = await DB.byIndex('answers', 'clientId', c.id);
        const rec = rows2.find((r) => r.qid === qid);
        if (rec) { rec.note = noteEl.value; await DB.put('answers', rec); }
      }
      // Re-render stage if this answer gates other questions
      rerender();
    }, 500);

    card.addEventListener('change', (e) => {
      if (e.target.hasAttribute('data-val') || e.target.hasAttribute('data-rep')) save();
    });
    card.addEventListener('input', (e) => {
      if ((e.target.hasAttribute('data-val') || e.target.hasAttribute('data-rep')) && !e.target.matches('select,[type=checkbox],[type=radio]')) save();
    });
    const addBtn = qs('[data-rep-add]', card);
    if (addBtn) addBtn.addEventListener('click', () => {
      const list = qs('[data-rep-list]', card);
      const div = document.createElement('div');
      div.className = 'repeat-row';
      div.innerHTML = '<input class="input" data-rep type="text"><button class="btn btn-sm btn-outline" data-rep-del>✕</button>';
      list.appendChild(div);
      div.querySelector('[data-rep-del]').addEventListener('click', () => { div.remove(); save(); });
      div.querySelector('[data-rep]').addEventListener('input', save);
    });
    qsa('[data-rep-del]', card).forEach((b) => b.addEventListener('click', () => {
      b.closest('.repeat-row').remove(); save();
    }));
    const naBtn = qs('[data-na]', card);
    naBtn.addEventListener('click', async () => {
      const rows = await DB.byIndex('answers', 'clientId', c.id);
      const existing = rows.find((r) => r.qid === qid);
      await saveAnswer(c.id, qid, existing ? existing.value : '', !(existing && existing.na));
      rerender();
    });
    const nt = qs('[data-note-toggle]', card);
    nt.addEventListener('click', () => {
      const nb = qs('[data-notebox]', card);
      nb.hidden = !nb.hidden;
      if (!nb.hidden) qs('[data-note]', card).focus();
    });
    const noteEl = qs('[data-note]', card);
    if (noteEl) noteEl.addEventListener('input', U.debounce(async () => {
      const rows = await DB.byIndex('answers', 'clientId', c.id);
      const rec = rows.find((r) => r.qid === qid);
      if (rec) { rec.note = noteEl.value; await DB.put('answers', rec); }
      else await saveAnswer(c.id, qid, '', false).then(async () => {
        const rows2 = await DB.byIndex('answers', 'clientId', c.id);
        const r2 = rows2.find((r) => r.qid === qid);
        if (r2) { r2.note = noteEl.value; await DB.put('answers', r2); }
      });
    }, 600));
  });
}

  const draw = () => {
    const rows = qs('#doc-rows');
    rows.innerHTML = docs.length ? docs.map((d) =>
      '<tr data-id="' + d.id + '">' +
      '<td><strong>' + U.esc(d.name) + '</strong>' + (d.custom ? ' <span class="badge b-info">Custom</span>' : '') + '</td>' +
      '<td class="small">' + U.esc(d.reason || '') + '</td>' +
      '<td class="small">' + U.esc(d.period || '') + '</td>' +
      '<td><span class="badge ' + (d.requirement === 'Mandatory' ? 'b-critical' : d.requirement === 'Conditional' ? 'b-medium' : 'b-info') + '">' + U.esc(d.requirement || '') + '</span></td>' +
      '<td>' + U.select('st', d.status, DATA.DOC_STATUS.map((s) => [s, s]), 'data-f="status" style="min-width:130px"') + '</td>' +
      '<td>' + U.input('dr', d.dateRequested || '', 'date', 'data-f="dateRequested"') + '</td>' +
      '<td>' + U.input('de', d.dateReceived || '', 'date', 'data-f="dateReceived"') + '</td>' +
      '<td>' + U.input('fr', d.fileRef || '', 'text', 'data-f="fileRef" placeholder="Local file name / path" style="min-width:140px"') + '</td>' +
      '<td>' + U.input('nt', d.notes || '', 'text', 'data-f="notes" placeholder="Notes" style="min-width:140px"') + '</td>' +
      '<td style="text-align:center"><input type="checkbox" data-f="followUp"' + (d.followUp ? ' checked' : '') + ' title="Follow-up required"></td>' +
      '<td class="row-actions">' + (d.custom ? '<button class="btn btn-sm btn-danger" data-del>✕</button>' : '') + '</td>' +
      '</tr>').join('') : '<tr><td colspan="11"><div class="empty">No checklist items yet. Click “Generate / Refresh Checklist”.</div></td></tr>';

      tr.addEventListener('change', async (e) => {
        const f = e.target.dataset.f;
        if (!f) return;
        const d = rec();
        if (f === 'followUp') d.followUp = e.target.checked;
        else d[f] = e.target.value;
        if (f === 'status' && d.status === 'Requested' && !d.dateRequested) d.dateRequested = U.today();
        if (f === 'status' && d.status === 'Received' && !d.dateReceived) d.dateReceived = U.today();

      });
      const del = qs('[data-del]', tr);

        const ok = await U.confirm('Remove document?', 'Remove "' + U.esc(rec().name) + '" from the checklist?', 'Remove');

        await DB.del('documents', id);
        const ix = docs.findIndex((x) => x.id === id);

  qs('#doc-refresh').onclick = async () => {

      U.field('Document name', U.input('name', ''), { req: true }) +
      U.field('Reason required', U.input('reason', '')) +
      '<div class="form-grid">' +
      U.field('Applicable period', U.input('period', 'Tax Year ' + U.esc(c.taxYear))) +

    const back = U.modal('Add Custom Document', body,
      '<button class="btn btn-outline" id="ad-no">Cancel</button><button class="btn btn-gold" id="ad-yes">Add</button>');
    back.querySelector('#ad-no').onclick = () => U.closeModal();
    back.querySelector('#ad-yes').onclick = async () => {
      const name = back.querySelector('[name=name]').value.trim();
      if (!name) { U.toast('Document name is required.', 'err'); return; }
      docs.push({
        id: U.uid('d'), clientId: c.id, name,
        reason: back.querySelector('[name=reason]').value.trim(),
        period: back.querySelector('[name=period]').value.trim(),
        requirement: back.querySelector('[name=requirement]').value,
        status: 'Not Requested', dateRequested: '', dateReceived: '',
        fileRef: '', notes: '', followUp: false, custom: true, updatedAt: U.now()
      });
      await DB.put('documents', docs[docs.length - 1]);
      await logActivity(c.id, 'Custom document added: ' + name + '.');
      U.closeModal(); renderView(); U.toast('Document added.', 'ok');
    };
  };
  qs('#doc-request-all').onclick = async () => {
    let n = 0;
    for (const d of docs) {
      if (d.status === 'Not Requested') {
        d.status = 'Requested'; if (!d.dateRequested) d.dateRequested = U.today();
        d.followUp = true; d.updatedAt = U.now();
        await DB.put('documents', d); n++;
      }
    }
    await logActivity(c.id, n + ' document(s) marked as Requested.');
    U.toast(n ? n + ' document(s) marked as Requested.' : 'Nothing to request.', 'ok');
    renderView();
  };
  qs('#doc-print').onclick = () => printDocChecklist(c, docs);
  qs('#doc-csv').onclick = () => {
    const rows = [['Document', 'Reason', 'Period', 'Requirement', 'Status', 'Date Requested', 'Date Received', 'File Ref', 'Notes', 'Follow-up']];
    docs.forEach((d) => rows.push([d.name, d.reason, d.period, d.requirement, d.status, d.dateRequested, d.dateReceived, d.fileRef, d.notes, d.followUp ? 'Yes' : 'No']));
    U.download('document-checklist-' + (c.internalId || c.id) + '.csv', U.toCSV(rows), 'text/csv');
    U.toast('CSV exported.', 'ok');
  };
}

async function refreshChecklist(c) {
  const existing = await DB.byIndex('documents', 'clientId', c.id);
  const have = new Set(existing.map((d) => d.name.toLowerCase()));
  const map = await getAnswersMap(c.id);
  let added = 0;
  for (const t of DATA.DOC_TEMPLATES) {
    if (t.cats !== 'all' && !t.cats.some((k) => c.categories.includes(k))) continue;
    if (t.condQ && ansValue(map, t.condQ) !== t.condVal) continue;
    if (have.has(t.name.toLowerCase())) continue;
    await DB.put('documents', {
      id: U.uid('d'), clientId: c.id, name: t.name, reason: t.reason,
      period: 'Tax Year ' + c.taxYear, requirement: t.requirement,

}
