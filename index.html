/* ============================== WEALTH RECONCILIATION ============================== */
function wealthExpected(w) {
  return U.num(w.openingWealth) + U.num(w.income) + U.num(w.giftsIn) + U.num(w.inheritances) +
    U.num(w.loansIn) + U.num(w.otherAdjustments) - U.num(w.expenditure) - U.num(w.giftsOut) - U.num(w.loansOut);
}

async function vWealth(v) {
  const c = requireClient(v);
  if (!c) return;
  let w = await DB.get('wealth', c.id);
  const map = await getAnswersMap(c.id);
  if (!w) {
    w = {
      clientId: c.id,
      openingWealth: ansValue(map, 'q_wr_opening') || '', income: ansValue(map, 'q_wr_income') || '',
      expenditure: ansValue(map, 'q_exp_household') || '',
      giftsIn: '', giftsOut: '', inheritances: '', loansIn: '', loansOut: '',
      otherAdjustments: '', closingWealth: ansValue(map, 'q_wr_closing') || '',
      notes: '', updatedAt: U.now()
    };
  }
  const assets = await DB.byIndex('assets', 'clientId', c.id);
  const schedNet = assets.filter((a) => a.kind === 'asset').reduce((s, a) => s + U.num(a.closing), 0) -
    assets.filter((a) => a.kind === 'liability').reduce((s, a) => s + U.num(a.closing), 0);
  const ty = await DB.get('taxyears', c.taxYear);

  v.innerHTML = clientHeader(c, 'Working paper — the application never inserts balancing figures') +
    (ty ? '<div class="alert warn">Tax-year rules: <strong>' + U.esc(ty.verificationStatus || 'Unverified') + '</strong>. ' +
      'Reconciliation method must follow the FBR requirements applicable to Tax Year ' + U.esc(c.taxYear) +
      ' — verify against official sources before filing.</div>' : '') +
    '<div class="grid c2"><div class="panel"><div class="panel-head"><h3>Reconciliation Inputs (Rs)</h3></div><div class="panel-body">' +
    '<div class="form-grid" id="w-form">' +
      U.field('Opening wealth / net assets', U.input('openingWealth', w.openingWealth, 'number', 'step="any" data-w')) +
      U.field('Income considered in reconciliation', U.input('income', w.income, 'number', 'step="any" data-w')) +
      U.field('Personal & household expenditure', U.input('expenditure', w.expenditure, 'number', 'step="any" data-w')) +
      U.field('Gifts received', U.input('giftsIn', w.giftsIn, 'number', 'step="any" data-w')) +
      U.field('Gifts given', U.input('giftsOut', w.giftsOut, 'number', 'step="any" data-w')) +
      U.field('Inheritances received', U.input('inheritances', w.inheritances, 'number', 'step="any" data-w')) +
      U.field('Loans received', U.input('loansIn', w.loansIn, 'number', 'step="any" data-w')) +
      U.field('Loans repaid', U.input('loansOut', w.loansOut, 'number', 'step="any" data-w')) +
      U.field('Other explained movements', U.input('otherAdjustments', w.otherAdjustments, 'number', 'step="any" data-w')) +
      U.field('Closing wealth / net assets (declared)', U.input('closingWealth', w.closingWealth, 'number', 'step="any" data-w')) +
    '</div>' +
    U.field('Explanation of differences / working notes', U.textarea('notes', w.notes, 'data-w-note rows="3"'), { hint: 'Record how any unexplained difference will be investigated — do not plug the difference.' }) +
    '<div class="btn-row"><button class="btn btn-gold" id="w-save">Save Reconciliation</button>' +
    '<button class="btn btn-outline" id="w-print">Print Working Paper</button></div>' +
    '</div></div>' +
    '<div class="panel"><div class="panel-head"><h3>Reconciliation Summary</h3></div><div class="panel-body" id="w-summary"></div></div></div>' +
    '<div class="alert info">Net assets per the Assets & Liabilities schedule (closing): <strong>' + U.fmt(schedNet) +
    '</strong> — shown for reference only. It is <strong>not</strong> automatically substituted into the reconciliation above.</div>';

  const draw = () => {
    const cur = {};
    qsa('[data-w]', v).forEach((i) => { cur[i.name] = i.value; });
    const exp = wealthExpected(cur);
    const diff = U.num(cur.closingWealth) - exp;
    const row = (l, val, cls) => '<tr><td>' + l + '</td><td class="num ' + (cls || '') + '">' + U.fmt(val) + '</td></tr>';
    qs('#w-summary').innerHTML =
      '<table class="data"><tbody>' +
      row('Opening wealth', cur.openingWealth) +
      row('Add: Income considered', cur.income) +
      row('Add: Gifts received', cur.giftsIn) +
      row('Add: Inheritances', cur.inheritances) +
      row('Add: Loans received', cur.loansIn) +
      row('Add/(Less): Other explained movements', cur.otherAdjustments) +
      row('Less: Personal & household expenditure', -U.num(cur.expenditure)) +
      row('Less: Gifts given', -U.num(cur.giftsOut)) +
      row('Less: Loans repaid', -U.num(cur.loansOut)) +
      '</tbody><tfoot><tr><td>Expected closing wealth</td><td class="num">' + U.fmt(exp) + '</td></tr>' +
      '<tr><td>Declared closing wealth</td><td class="num">' + U.fmt(cur.closingWealth) + '</td></tr>' +
      '<tr><td>Unexplained difference</td><td class="num ' + (diff === 0 ? 'diff-zero' : 'diff-positive') + '">' + U.fmt(diff) + '</td></tr>' +
      '</tfoot></table>' +
      (diff === 0
        ? '<div class="alert ok" style="margin-top:10px">Reconciliation agrees. The difference is zero based on the figures entered.</div>'
        : '<div class="alert danger" style="margin-top:10px"><strong>Unexplained difference of ' + U.fmt(Math.abs(diff)) + '.</strong> ' +
          'Do not create a balancing figure. Investigate: unrecorded income, understated expenditure, missing asset/liability movements, or gifts. Document the resolution in the notes.</div>');
  };
  qsa('[data-w]', v).forEach((i) => i.addEventListener('input', draw));
  draw();

  qs('#w-save').onclick = async () => {
    const rec = { clientId: c.id, updatedAt: U.now() };
    qsa('[data-w]', v).forEach((i) => { rec[i.name] = i.value === '' ? '' : U.num(i.value); });
    rec.notes = qs('[data-w-note]').value.trim();
    await DB.put('wealth', rec);
    c.updatedAt = U.now(); await DB.put('clients', c);
    await logActivity(c.id, 'Wealth reconciliation saved.');
    U.toast('Reconciliation saved.', 'ok');
  };
  qs('#w-print').onclick = async () => {
    const cur = {};
    qsa('[data-w]', v).forEach((i) => { cur[i.name] = i.value; });
    const exp = wealthExpected(cur);
    const diff = U.num(cur.closingWealth) - exp;
    const r = (l, val) => '<tr><td>' + l + '</td><td>' + U.fmt(val) + '</td></tr>';
    const body = '<h2>Wealth Reconciliation Working Paper — ' + U.esc(c.fullName) + ' (Tax Year ' + U.esc(c.taxYear) + ')</h2>' +
      '<table><tbody>' + r('Opening wealth', cur.openingWealth) + r('Add: Income considered', cur.income) +
      r('Add: Gifts received', cur.giftsIn) + r('Add: Inheritances', cur.inheritances) + r('Add: Loans received', cur.loansIn) +
      r('Add/(Less): Other explained movements', cur.otherAdjustments) + r('Less: Personal & household expenditure', -U.num(cur.expenditure)) +
      r('Less: Gifts given', -U.num(cur.giftsOut)) + r('Less: Loans repaid', -U.num(cur.loansOut)) +
      '</tbody></table><table><tbody>' + r('<strong>Expected closing wealth</strong>', exp) +
      r('<strong>Declared closing wealth</strong>', cur.closingWealth) +
      r('<strong>Unexplained difference</strong>', diff) + '</tbody></table>' +
      '<h2>Notes</h2><p>' + U.esc(qs('[data-w-note]').value || '—') + '</p>' +
      '<p><em>This is a preparation working paper, not the official FBR wealth statement. Verify the reconciliation method against the FBR requirements for Tax Year ' + U.esc(c.taxYear) + '.</em></p>';
    U.printHTML('Wealth Reconciliation Working Paper', body, U.esc(c.fullName) + ' · TY ' + U.esc(c.taxYear));
  };
}

/* ============================== REVIEW & QUALITY CONTROL ============================== */
const SEV_CLASS = { Critical: 'b-critical', High: 'b-high', Medium: 'b-medium', Low: 'b-low', Informational: 'b-info' };

async function vReview(v) {
  const c = requireClient(v);
  if (!c) return;
  let issues = await DB.byIndex('issues', 'clientId', c.id);
  issues.sort((a, b) => (a.severity || '').localeCompare(b.severity || ''));

  const pending = issues.filter((i) => i.status === 'Pending');
  const done = issues.filter((i) => i.status !== 'Pending');
  const sevCount = (s) => pending.filter((i) => i.severity === s).length;

  v.innerHTML = clientHeader(c, 'Issues are flagged by rules — readiness is never automatic') +
    '<div class="toolbar"><button class="btn btn-gold btn-sm" id="rv-run">▶ Run Quality Checks</button>' +
    '<button class="btn btn-outline btn-sm" id="rv-add">+ Add Manual Issue</button>' +
    '<button class="btn btn-outline btn-sm" id="rv-print">Print Issues Report</button>' +
    '<span class="muted small" style="margin-left:auto">Pending: ' +
    ['Critical', 'High', 'Medium', 'Low', 'Informational'].map((s) => s + ' ' + sevCount(s)).join(' · ') + '</span></div>' +
    '<div class="alert info">Each issue explains <strong>why</strong> it was flagged and <strong>what to do</strong>. ' +
    'A reviewer must explicitly mark issues Resolved or Accepted with Explanation. Clearing every form field does <strong>not</strong> mark a file ready.</div>' +
    '<h3>Pending Issues (' + pending.length + ')</h3><div id="rv-pending">' +
    (pending.length ? pending.map(issueCard).join('') : '<div class="empty">No pending issues. Run the quality checks to verify.</div>') + '</div>' +
    '<h3 style="margin-top:16px">Resolved / Accepted (' + done.length + ')</h3><div id="rv-done">' +
    (done.length ? done.map(issueCard).join('') : '<div class="empty">Nothing resolved or accepted yet.</div>') + '</div>';

  qs('#rv-run').onclick = async () => {
    const n = await runChecks(c);
    await logActivity(c.id, 'Quality checks run (' + n + ' open issue(s) flagged).');
    U.toast(n ? n + ' issue(s) flagged.' : 'No issues found.', n ? 'err' : 'ok');
    renderView();
  };
  qs('#rv-add').onclick = () => manualIssueModal(c, () => renderView());
  qs('#rv-print').onclick = async () => {
    const all = await DB.byIndex('issues', 'clientId', c.id);
    printIssuesReport(c, all);
  };
  wireIssueCards(v, c, () => renderView());
}

function issueCard(i) {
  return '<div class="q-card"><div class="q-head"><span class="badge ' + (SEV_CLASS[i.severity] || 'b-info') + '">' +
    U.esc(i.severity) + '</span><div class="q-text">' + U.esc(i.title) + '</div>' +
    '<span class="badge ' + (i.status === 'Pending' ? 'b-open' : i.status === 'Resolved' ? 'b-resolved' : 'b-accepted') + '">' +
    U.esc(i.status) + '</span></div>' +
    '<p class="small"><strong>Why flagged:</strong> ' + U.esc(i.why) + '</p>' +
    '<p class="small"><strong>Action required:</strong> ' + U.esc(i.action) + '</p>' +
    (i.resolutionNote ? '<p class="small"><strong>Resolution note:</strong> ' + U.esc(i.resolutionNote) + '</p>' : '') +
    '<div class="btn-row" data-issue="' + i.id + '">' +
    (i.status === 'Pending'
      ? '<button class="btn btn-sm btn-navy" data-res="Resolved">Mark Resolved</button>' +
        '<button class="btn btn-sm btn-outline" data-res="Accepted">Accept with Explanation</button>'
      : '<button class="btn btn-sm btn-outline" data-res="Pending">Reopen</button>') +
    (i.auto ? '' : ' <button class="btn btn-sm btn-danger" data-del-issue>Delete</button>') +
    '</div></div>';
}

function wireIssueCards(v, c, rerender) {
  qsa('[data-issue]', v).forEach((box) => {
    const id = box.dataset.issue;
    qsa('[data-res]', box).forEach((b) => b.addEventListener('click', async () => {
      const to = b.dataset.res;
      const rec = await DB.get('issues', id);
      if (!rec) return;
      if (to === 'Accepted') {
        const back = U.modal('Accept with Explanation',
          '<p>Record why this issue is accepted without further action:</p>' + U.textarea('note', rec.resolutionNote || ''),
          '<button class="btn btn-outline" id="ac-no">Cancel</button><button class="btn btn-gold" id="ac-yes">Accept Issue</button>');
        back.querySelector('#ac-no').onclick = () => U.closeModal();
        back.querySelector('#ac-yes').onclick = async () => {
          const note = back.querySelector('[name=note]').value.trim();
          if (!note) { U.toast('An explanation is required to accept an issue.', 'err'); return; }
          rec.status = 'Accepted'; rec.resolutionNote = note; rec.updatedAt = U.now();
          await DB.put('issues', rec);
          await logActivity(c.id, 'Issue accepted with explanation: ' + rec.title + '.');
          U.closeModal(); rerender();
        };
      } else {
        rec.status = to; rec.updatedAt = U.now();
        await DB.put('issues', rec);
        await logActivity(c.id, 'Issue ' + to.toLowerCase() + ': ' + rec.title + '.');
        rerender();
      }
    }));
    const del = qs('[data-del-issue]', box);
    if (del) del.addEventListener('click', async () => {
      const ok = await U.confirm('Delete issue?', 'Delete this manually-added issue?', 'Delete');
      if (!ok) return;
      await DB.del('issues', id);
      rerender();
    });
  });
}

async function runChecks(c) {
  const existing = await DB.byIndex('issues', 'clientId', c.id);
  for (const i of existing.filter((x) => x.auto && x.status === 'Pending')) await DB.del('issues', i.id);
  const kept = (await DB.byIndex('issues', 'clientId', c.id)).filter((x) => x.status !== 'Pending');
  const seen = new Set(kept.map((x) => x.rule + '|' + x.ref));
  const out = [];
  const flag = (rule, ref, severity, title, why, action) => {
    if (seen.has(rule + '|' + ref)) return;
    out.push({
      id: U.uid('is'), clientId: c.id, rule, ref, severity, title, why, action,
      status: 'Pending', resolutionNote: '', auto: true, updatedAt: U.now()
    });
  };

  // 1. Missing required interview answers
  const list = await applicableQuestions(c);
  const missing = list.filter((x) => x.q.required && !isAnswered(x.q, x.ans));
  if (missing.length) {
    flag('missing_answers', 'all', 'High',
      missing.length + ' required interview answer(s) missing',
      'The following required questions have no answer and are not marked N/A: ' +
        missing.slice(0, 6).map((x) => '“' + x.q.text + '”').join('; ') + (missing.length > 6 ? ' (+' + (missing.length - 6) + ' more)' : '') + '.',
      'Complete the Tax Interview for each listed question, or mark genuinely inapplicable questions as N/A with a note.');
  }
  // 2. Mandatory documents not received
  const docs = await DB.byIndex('documents', 'clientId', c.id);
  docs.filter((d) => d.requirement === 'Mandatory' && !['Received', 'Reviewed', 'Not Applicable'].includes(d.status))
    .forEach((d) => flag('doc_pending', d.id, d.status === 'Missing' ? 'High' : 'Medium',
      'Mandatory document not received: ' + d.name,
      '“' + d.name + '” is marked as a mandatory requirement and its status is “' + d.status + '”. A file cannot be review-ready without mandatory evidence.',
      d.status === 'Not Requested' ? 'Request the document from the client (Document Checklist → Request All Pending).' : 'Follow up with the client; record the date received explicitly when it arrives.'));
  // 3/4/5. Income entry checks
  const incomes = await DB.byIndex('incomes', 'clientId', c.id);
  incomes.filter((i) => U.num(i.gross) >= 500000 && !i.docRef).forEach((i) =>
    flag('unsupported_figure', i.id, 'Medium', 'Material figure without supporting document: ' + (i.source || i.section),
      'An entry of ' + U.fmt(i.gross) + ' (' + DATA.incomeSectionLabel(i.section) + ') has no document reference. Material figures must be supported.',
      'Attach the supporting document reference (certificate, statement, PRC, agreement) to the entry, or record why it is unavailable.'));
  incomes.filter((i) => U.num(i.taxDeducted) > 0 && !i.docRef && (i.section === 'wht' || i.section === 'salary' || i.section === 'bankprofit' || i.section === 'dividend'))
    .forEach((i) => flag('wht_evidence', i.id, 'High', 'Withholding tax claimed without certificate: ' + (i.source || i.section),
      U.fmt(i.taxDeducted) + ' of tax deducted is recorded with no certificate reference. FBR credits require evidence.',
      'Obtain the withholding certificate / challan and record its reference on the entry.'));
  incomes.filter((i) => (U.num(i.gross) > 0 || U.num(i.taxDeducted) > 0) && (!i.treatment || i.treatment === 'Unverified'))
    .forEach((i) => flag('unverified_treatment', i.id, 'Medium', 'Unverified tax treatment: ' + (i.source || i.section),
      'The entry’s tax treatment is still “Unverified”. The application never assumes whether a receipt is taxable or a withholding is adjustable.',
      'Verify against the Tax Year ' + c.taxYear + ' rules and set the treatment (Adjustable / Final Tax / Minimum Tax / Exempt / Separate Block).'));
  // 6. Possible duplicates
  const seenKeys = {};
  incomes.forEach((i) => {
    const k = [i.section, (i.source || '').toLowerCase().trim(), (i.period || '').trim(), i.gross].join('|');
    if (seenKeys[k]) flag('duplicate', i.id, 'Medium', 'Possible duplicate entry: ' + (i.source || i.section),
      'Two entries share the same section, source, period and amount (' + U.fmt(i.gross) + '). This may be a double entry.',
      'Verify with source documents; delete the duplicate if confirmed.');
    seenKeys[k] = true;
  });
  // 7. Wealth reconciliation difference
  const w = await DB.get('wealth', c.id);
  if (w && (w.closingWealth !== '' && w.closingWealth !== undefined)) {
    const diff = U.num(w.closingWealth) - wealthExpected(w);
    if (diff !== 0) flag('wealth_diff', 'main', 'High', 'Unexplained wealth difference of ' + U.fmt(Math.abs(diff)),
      'The wealth reconciliation does not agree: declared closing wealth differs from the computed expected figure by ' + U.fmt(diff) + '. No balancing figure has been inserted.',
      'Investigate unrecorded income, understated expenditure, or missing asset/liability movements. Record the resolution in the reconciliation notes.');
  }
  // 8. Asset consistency
  const assets = await DB.byIndex('assets', 'clientId', c.id);
  assets.filter((a) => U.num(a.ownershipPct) > 100).forEach((a) =>
    flag('ownership', a.id, 'Medium', 'Ownership exceeds 100%: ' + (a.description || a.type),
      'Ownership percentage is recorded as ' + a.ownershipPct + '%, which is inconsistent.',
      'Correct the ownership percentage to the client’s actual share.'));
  assets.filter((a) => U.num(a.closing) < 0 && a.kind === 'asset').forEach((a) =>
    flag('negative_asset', a.id, 'Medium', 'Negative closing balance on asset: ' + (a.description || a.type),
      'An asset shows a negative closing balance (' + U.fmt(a.closing) + '), which usually indicates a data entry error.',
      'Verify and correct the opening/closing balances.'));
  // 9. Client confirmation
  const map = await getAnswersMap(c.id);
  if (ansValue(map, 'q_client_confirm') !== 'yes')
    flag('client_confirm', 'q_client_confirm', 'High', 'Missing client confirmation of figures',
      'The client has not confirmed the figures provided so far (interview stage 11). Review cannot conclude without it.',
      'Obtain explicit client confirmation and record it in the interview.');
  // 10. Received docs without file reference (informational)
  docs.filter((d) => d.status === 'Received' && !d.fileRef).forEach((d) =>
    flag('doc_fileref', d.id, 'Informational', 'Received document has no file reference: ' + d.name,
      'The document is marked received but no local file reference is recorded, which slows retrieval during review.',
      'Record the local file name / location in the File Reference column.'));

  for (const i of out) await DB.put('issues', i);
  return out.length;
}

/* ============================== WORKING PAPERS & CLIENT SUMMARY ============================== */
async function clientSummaryData(c) {
  const [incomes, docs, issues, assets, wealth, list] = await Promise.all([
    DB.byIndex('incomes', 'clientId', c.id), DB.byIndex('documents', 'clientId', c.id),
    DB.byIndex('issues', 'clientId', c.id), DB.byIndex('assets', 'clientId', c.id),
    DB.get('wealth', c.id), applicableQuestions(c)
  ]);
  const p = await interviewProgress(c);
  const bySec = {};
  DATA.INCOME_SECTIONS.forEach(([k, label]) => {
    const rr = incomes.filter((i) => i.section === k);
    bySec[k] = { label, n: rr.length, gross: rr.reduce((s, i) => s + U.num(i.gross), 0), wht: rr.reduce((s, i) => s + U.num(i.taxDeducted), 0) };
  });
  const advPaid = incomes.filter((i) => i.section === 'advance').reduce((s, i) => s + U.num(i.gross) + U.num(i.taxDeducted), 0);
  const assetCl = assets.filter((a) => a.kind === 'asset').reduce((s, a) => s + U.num(a.closing), 0);
  const liabCl = assets.filter((a) => a.kind === 'liability').reduce((s, a) => s + U.num(a.closing), 0);
  const docCounts = {};
  DATA.DOC_STATUS.forEach((s) => docCounts[s] = docs.filter((d) => d.status === s).length);
  const outstanding = list.filter((x) => x.q.required && !isAnswered(x.q, x.ans));
  const pendingIssues = issues.filter((i) => i.status === 'Pending');
  const critHigh = pendingIssues.filter((i) => ['Critical', 'High'].includes(i.severity)).length;
  let wealthDiff = null, wealthOk = false;
  if (wealth && wealth.closingWealth !== '' && wealth.closingWealth !== undefined) {
    wealthDiff = U.num(wealth.closingWealth) - wealthExpected(wealth);
    wealthOk = wealthDiff === 0;
  }
  const mandatoryDocsOk = !docs.some((d) => d.requirement === 'Mandatory' && !['Received', 'Reviewed', 'Not Applicable'].includes(d.status));
  const amap = await getAnswersMap(c.id);
  const checks = [
    { label: 'Interview required questions answered (' + p.reqDone + '/' + p.reqTotal + ')', ok: p.pct === 100 },
    { label: 'All mandatory documents received/reviewed', ok: mandatoryDocsOk },
    { label: 'No Critical/High review issues pending', ok: critHigh === 0 },
    { label: 'Wealth reconciliation agrees (where applicable)', ok: wealthDiff === null ? true : wealthOk },
    { label: 'Client confirmed the figures', ok: ansValue(amap, 'q_client_confirm') === 'yes' }
  ];
  const ready = checks.every((x) => x.ok);
  return { incomes, docs, issues, assets, wealth, bySec, advPaid, assetCl, liabCl, docCounts, outstanding, pendingIssues, critHigh, wealthDiff, wealthOk, checks, ready, progress: p };
}

      'Automated checks passing does not replace reviewer judgment. Continue?', 'Mark Ready');

async function printPaper(c, s, kind) {
  const head = (t) => '<h2>' + t + ' — ' + U.esc(c.fullName) + ' (Tax Year ' + U.esc(c.taxYear) + ')</h2>';
  if (kind === 'income') {
    U.printHTML('Working Paper — Income Information', head('Income Information') +
      '<table><thead><tr><th>Section</th><th>Source</th><th>Gross (Rs)</th><th>Taxable (Rs)</th><th>Tax Deducted (Rs)</th><th>Treatment</th><th>Doc Ref</th></tr></thead><tbody>' +
      s.incomes.map((i) => '<tr><td>' + U.esc(DATA.incomeSectionLabel(i.section)) + '</td><td>' + U.esc(i.source || '') + '</td><td>' + U.fmtPlain(i.gross) + '</td><td>' + U.fmtPlain(i.taxable) + '</td><td>' + U.fmtPlain(i.taxDeducted) + '</td><td>' + U.esc(i.treatment || '') + '</td><td>' + U.esc(i.docRef || '') + '</td></tr>').join('') +
      '</tbody></table><p><em>Preparation aid only.</em></p>', U.esc(c.fullName));
  } else if (kind === 'wht') {
    const rows = s.incomes.filter((i) => U.num(i.taxDeducted) > 0 || i.section === 'advance');
    const tot = rows.reduce((x, i) => x + U.num(i.taxDeducted), 0);
    U.printHTML('Working Paper — Tax Deduction Reconciliation', head('Tax Deduction Reconciliation') +
      '<table><thead><tr><th>Source</th><th>Section</th><th>Amount (Rs)</th><th>Certificate / Evidence Ref</th></tr></thead><tbody>' +
      rows.map((i) => '<tr><td>' + U.esc(i.source || '') + '</td><td>' + U.esc(DATA.incomeSectionLabel(i.section)) + '</td><td>' + U.fmtPlain(i.taxDeducted) + '</td><td>' + U.esc(i.docRef || '— MISSING') + '</td></tr>').join('') +
      '</tbody></table><p><strong>Total tax deducted/paid: ' + U.fmt(tot) + '</strong></p><p><em>Verify each credit is adjustable/final per Tax Year ' + U.esc(c.taxYear) + ' rules before claiming.</em></p>', U.esc(c.fullName));
  } else if (kind === 'assets') {
    const sec = (k, label) => {
      const rr = s.assets.filter((a) => a.kind === k);
      return '<h2>' + label + '</h2>' + (rr.length ? '<table><thead><tr><th>Type</th><th>Description</th><th>Ownership %</th><th>Opening (Rs)</th><th>Closing (Rs)</th><th>Valuation Basis</th></tr></thead><tbody>' +
        rr.map((a) => '<tr><td>' + U.esc(DATA.assetTypeLabel(a.type)) + '</td><td>' + U.esc(a.description || '') + '</td><td>' + U.esc(a.ownershipPct) + '</td><td>' + U.fmtPlain(a.opening) + '</td><td>' + U.fmtPlain(a.closing) + '</td><td>' + U.esc(a.valueBasis || '') + '</td></tr>').join('') + '</tbody></table>' : '<p>None recorded.</p>');
    };
    U.printHTML('Working Paper — Assets & Liabilities', head('Assets & Liabilities Schedules') + sec('asset', 'Assets') + sec('liability', 'Liabilities'), U.esc(c.fullName));
  } else if (kind === 'wealth') {
    const w = s.wealth || {};
    const exp = wealthExpected(w);
    const diff = U.num(w.closingWealth) - exp;
    const r = (l, val) => '<tr><td>' + l + '</td><td>' + U.fmt(val) + '</td></tr>';
    U.printHTML('Working Paper — Wealth Reconciliation', head('Wealth Reconciliation') +
      '<table><tbody>' + r('Opening wealth', w.openingWealth) + r('Add: Income considered', w.income) +
      r('Add: Gifts received', w.giftsIn) + r('Add: Inheritances', w.inheritances) + r('Add: Loans received', w.loansIn) +
      r('Add/(Less): Other explained movements', w.otherAdjustments) + r('Less: Personal & household expenditure', -U.num(w.expenditure)) +
      r('Less: Gifts given', -U.num(w.giftsOut)) + r('Less: Loans repaid', -U.num(w.loansOut)) +
      r('<strong>Expected closing wealth</strong>', exp) + r('<strong>Declared closing wealth</strong>', w.closingWealth) +
      r('<strong>Unexplained difference</strong>', diff) + '</tbody></table><h2>Notes</h2><p>' + U.esc(w.notes || '—') + '</p>', U.esc(c.fullName));
  } else if (kind === 'missing') {
    const miss = s.docs.filter((d) => ['Requested', 'Missing'].includes(d.status));
    const body = '<h2>Missing Documents — ' + U.esc(c.fullName) + ' (Tax Year ' + U.esc(c.taxYear) + ')</h2>' +
      (miss.length ? '<table><thead><tr><th>Document</th><th>Requirement</th><th>Status</th><th>Date Requested</th><th>Follow-up</th><th>Notes</th></tr></thead><tbody>' +
        miss.map((d) => '<tr><td>' + U.esc(d.name) + '</td><td>' + U.esc(d.requirement) + '</td><td>' + U.esc(d.status) + '</td><td>' + U.esc(d.dateRequested || '—') + '</td><td>' + (d.followUp ? 'Yes' : 'No') + '</td><td>' + U.esc(d.notes || '') + '</td></tr>').join('') + '</tbody></table>'
        : '<p>No documents are currently requested or missing.</p>');
    U.printHTML('Working Paper — Missing Documents', body, U.esc(c.fullName) + ' · TY ' + U.esc(c.taxYear));
  } else if (kind === 'qc') {
    printIssuesReport(c, s.issues);
  }
}

async function runReportCsv(c, kind) {
  if (!c) { U.toast('Select a client first.', 'err'); return; }
  const s = await clientSummaryData(c);
  const base = 'asna-' + kind + '-' + (c.internalId || c.id);
  if (kind === 'docs') {
    const rows = [['Document', 'Reason', 'Period', 'Requirement', 'Status', 'Date Requested', 'Date Received', 'Notes']];
    s.docs.forEach((d) => rows.push([d.name, d.reason, d.period, d.requirement, d.status, d.dateRequested, d.dateReceived, d.notes]));
    U.download(base + '.csv', U.toCSV(rows), 'text/csv');
  } else if (kind === 'income' || kind === 'wht') {
    const rows = [['Section', 'Source', 'Period', 'Gross', 'Taxable', 'Tax Deducted', 'Treatment', 'Doc Ref', 'Notes']];
    s.incomes.filter((i) => kind === 'income' || U.num(i.taxDeducted) > 0 || i.section === 'advance')
      .forEach((i) => rows.push([DATA.incomeSectionLabel(i.section), i.source, i.period, i.gross, i.taxable, i.taxDeducted, i.treatment, i.docRef, i.notes]));
    U.download(base + '.csv', U.toCSV(rows), 'text/csv');
  } else if (kind === 'assets') {
    const rows = [['Kind', 'Type', 'Description', 'Ownership %', 'Opening', 'Closing', 'Valuation Basis']];
    s.assets.forEach((a) => rows.push([a.kind, DATA.assetTypeLabel(a.type), a.description, a.ownershipPct, a.opening, a.closing, a.valueBasis]));
    U.download(base + '.csv', U.toCSV(rows), 'text/csv');
  } else if (kind === 'interview') {
    const list = await applicableQuestions(c);
    const rows = [['Stage', 'Question', 'Answer', 'N/A']];
    list.forEach((x) => rows.push([DATA.STAGES[x.q.stage - 1], x.q.text,
      x.ans && !x.ans.na ? (Array.isArray(x.ans.value) ? x.ans.value.join('; ') : x.ans.value) : '', x.ans && x.ans.na ? 'Yes' : 'No']));
    U.download(base + '.csv', U.toCSV(rows), 'text/csv');
  }
  U.toast('CSV exported.', 'ok');
}

    years.map((y) => '<tr><td><strong>' + U.esc(y.year) + '</strong></td><td class="small">' + U.esc(y.rulesRef || '') + '</td>' +
      '<td class="small">' + U.esc(y.effectiveDate || '') + '</td>' +
      '<td><span class="badge ' + (/unverified/i.test(y.verificationStatus || '') ? 'b-medium' : 'b-complete') + '">' + U.esc(y.verificationStatus || '—') + '</span></td>' +
      '<td class="small">' + U.esc(y.notes || '') + '</td>' +
      '<td class="row-actions"><button class="btn btn-sm btn-outline" data-ty="' + U.esc(y.year) + '">Edit</button></td></tr>').join('') +
    '</tbody></table></div></div></div>' +

    '<div class="panel"><div class="panel-head"><h3>Privacy & Data Protection</h3><button class="btn btn-sm btn-outline" id="pr-view">View Privacy Notice</button></div>' +
    '<div class="panel-body"><dl class="kv">' +
    '<dt>Storage</dt><dd>Local IndexedDB in this browser only — no cloud, no transmission. ' + U.esc(usage) + '.</dd>' +
    '<dt>Encryption</dt><dd><strong>Browser storage is not encrypted.</strong> Protect this device and keep backups secure.</dd>' +
    '<dt>Client file PIN</dt><dd>File: <strong>' + U.esc(currentClient().fullName) + '</strong> — ' +
    (currentClient().pinHash ? 'PIN is set' : '<strong>No PIN set</strong>') +
    ' <button class="btn btn-sm btn-outline" id="st-pin">' + (currentClient().pinHash ? 'Change PIN' : 'Set PIN') + '</button></dd>' +
    '<dt>Prohibited data</dt><dd>Never record IRIS passwords, OTPs, bank PINs or account passwords in this application.</dd>' +
    '</dl></div></div>' +

    '<div class="panel"><div class="panel-head"><h3>Danger Zone</h3></div><div class="panel-body">' +
    '<div class="btn-row" style="margin-top:0"><button class="btn btn-danger btn-sm" id="dz-wipe">Delete ALL Data…</button></div>' +
    '<p class="muted small">Permanently removes every client file, answer, document, and setting from this browser. Export a backup first.</p>' +
    '</div></div>' +

    '<div class="panel"><div class="panel-head"><h3>About</h3></div><div class="panel-body">' +
    '<p class="small"><strong>ASNA Tax Client Manager</strong> v1.9 — internal tool for ASNA Consultancy.<br>' +
    'Offline-first · Vanilla JS · IndexedDB · No external dependencies.<br>' +
    'Preparation aids only — not a substitute for the official tax return or IRIS filing.</p></div></div>';

  qs('#ty-add').onclick = () => taxYearModal(null, () => renderView());
  qsa('[data-ty]', v).forEach((b) => b.addEventListener('click', async () => {
    taxYearModal(await DB.get('taxyears', b.dataset.ty), () => renderView());
  }));
  qs('#pr-view').onclick = () => showPrivacyModal(false);

  qs('#st-pin').onclick = () => changeClientPinModal(currentClient(), () => renderView());

  qs('#dz-wipe').onclick = async () => {
    const ok1 = await U.confirm('Delete ALL data?',
      'This will <strong>permanently delete EVERYTHING</strong> in this application — all clients, answers, documents, income, assets, wealth workings, issues and settings. Export a backup first if needed.',
      'Continue');
    if (!ok1) return;
    const ok2 = await U.confirm('Final confirmation',
      'There is no undo. Delete all data now?', 'Delete Everything');
    if (!ok2) return;
    for (const s of DB.storeNames) await DB.clear(s);
    Object.keys(localStorage).filter((k) => k.startsWith('asna_')).forEach((k) => localStorage.removeItem(k));
    localStorage.setItem('asna_seen_privacy', '1'); // don't re-show notice after a deliberate wipe
    localStorage.setItem('asna_no_reseed', '1');    // don't re-seed samples after a deliberate wipe
    location.reload();
  };
}

function taxYearModal(existing, onDone) {
  const y = existing || {};
  const body =
    '<div class="form-grid">' +
    U.field('Tax Year', U.input('year', y.year || '', 'text', existing ? 'readonly' : 'required'), { req: true }) +
    U.field('Effective Date', U.input('effectiveDate', y.effectiveDate || '', 'date')) +
    '</div>' +
    U.field('Applicable Rules Reference', U.input('rulesRef', y.rulesRef || '', 'text', 'placeholder="e.g. Income Tax Ordinance, 2001 as amended for TY 2026"')) +
    U.field('Verification Status', U.select('verificationStatus', y.verificationStatus || 'Unverified — confirm against FBR official sources before use',
      [['Unverified — confirm against FBR official sources before use', 'Unverified — confirm before use'], ['Verified against FBR sources', 'Verified against FBR sources'], ['Partially verified', 'Partially verified']])) +
    U.field('Tax Rates / Thresholds (if implemented)', U.textarea('rates', y.rates || ''), { hint: 'Optional reference notes only — never treat these as permanently valid law.' }) +
    U.field('Notes', U.textarea('notes', y.notes || ''));
  const back = U.modal(existing ? 'Edit Tax Year' : 'Add Tax Year', body,
    '<button class="btn btn-outline" id="ty-no">Cancel</button><button class="btn btn-gold" id="ty-yes">Save</button>');
  back.querySelector('#ty-no').onclick = () => U.closeModal();
  back.querySelector('#ty-yes').onclick = async () => {
    const f = (n) => back.querySelector('[name=' + n + ']').value.trim();
    if (!f('year')) { U.toast('Tax Year is required.', 'err'); return; }
    await DB.put('taxyears', {
      year: f('year'), effectiveDate: f('effectiveDate'), rulesRef: f('rulesRef'),
      verificationStatus: back.querySelector('[name=verificationStatus]').value,
      rates: back.querySelector('[name=rates]').value.trim(), notes: back.querySelector('[name=notes]').value.trim()
    });
    await logActivity(null, 'Tax Year ' + f('year') + ' settings saved.');
    U.closeModal(); U.toast('Tax year saved.', 'ok');
    onDone();
  };
}

/* ============================== init ============================== */
// Surface unexpected errors visibly instead of failing silently.
window.addEventListener('error', (ev) => {
  try {
    const msg = (ev && ev.message) || 'Unknown error';
    lastAppError = msg + ' @ ' + new Date().toLocaleTimeString();
    if (/Script error/i.test(msg)) return; // cross-origin noise, no detail available
    U.toast('Something went wrong: ' + msg, 'err');
  } catch (e) { /* toast itself must never throw */ }
});
window.addEventListener('unhandledrejection', (ev) => {
  try {
    const r = ev && ev.reason;
    const msg = (r && r.message) || String(r);
    lastAppError = msg + ' @ ' + new Date().toLocaleTimeString();
    if (/Script error/i.test(msg)) return;
    U.toast('Something went wrong: ' + msg, 'err');
  } catch (e) { /* never throw */ }
});
document.addEventListener('DOMContentLoaded', () => {
  boot().catch((err) => {
    console.error(err);
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2>Could not start the application</h2>' +
      '<p>' + U.esc(err.message) + '</p><p>IndexedDB must be available. Please use a modern browser (Chrome, Edge, Firefox) and allow local storage for this page.</p></div>';
  });
});

</script>
</body>
</html>
